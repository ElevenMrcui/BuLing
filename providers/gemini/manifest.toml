# Gemini CLI —— Google 官方终端 Agent。
#
# 状态：manifest 已声明，Rust adapter 尚未实现（cli_adapter 留空）。
# 加 adapter 前必须先用真实 `gemini --help` 核实参数格式，不臆造。

id = "gemini-cli"
display_name = "Gemini CLI"
vendor = "Google"
kind = "cli"

cli_binary = "gemini"

allowed_sensitivity = ["low", "medium"]
privacy_note = "走用户本机已登录的 Gemini CLI 会话；数据流向遵循用户与 Google 之间已有的服务条款。"
