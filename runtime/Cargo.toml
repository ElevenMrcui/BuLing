[workspace]
resolver = "2"
members = [
    "crates/opc-storage",
    "crates/opc-provider",
    "crates/opc-agent",
    "crates/opc-tool",
    "crates/opc-project",
    "crates/opc-workflow",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["不令 OPC · BuLing"]
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/ElevenMrcui/BuLing"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
