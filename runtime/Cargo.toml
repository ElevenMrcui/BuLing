[workspace]
resolver = "2"
members = [
    "crates/opc-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["不令 OPC · BuLing"]
license = "MIT"
rust-version = "1.75"
repository = "https://github.com/ElevenMrcui/BuLing"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
futures-util = "0.3"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
