services:
  postgres:
    image: postgres:16-alpine
    container_name: buling-postgres
    environment:
      POSTGRES_USER: buling
      POSTGRES_PASSWORD: buling
      POSTGRES_DB: buling
    ports:
      - "5432:5432"
    volumes:
      - buling-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buling"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: buling-redis
    ports:
      - "6379:6379"
    volumes:
      - buling-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  buling-pg:
  buling-redis:
