<html lang="zh-CN">
<head>

<title>不令</title>
<!-- PWA / 手机浏览器体验：颜色跟随浅/深色，可加到主屏，全屏无浏览器栏（iOS 需 Safari 手动"添加到主屏幕"）。
     单文件原型没有 service worker，装到主屏后是"仅在线版"；R2 分发到 apps/web 时再补真正的 SW。 -->
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a0a0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="不令">
<meta name="mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="%23007aff"/><text x="32" y="44" font-family="-apple-system,SF Pro Text,Helvetica,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="white">令</text></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><rect width="180" height="180" rx="36" fill="%23007aff"/><text x="90" y="124" font-family="-apple-system,SF Pro Text,Helvetica,Arial,sans-serif" font-size="98" font-weight="700" text-anchor="middle" fill="white">令</text></svg>'>

<style>
  /* ============ Design tokens ============ */
  :root{
    --bg: #f5f5f7;
    --bg-elevated: #fbfbfd;
    --surface: #ffffff;
    --surface-translucent: rgba(255,255,255,0.74);
    --surface-sunken: #eeeef0;
    --ink: #1d1d1f;
    --ink-secondary: #6e6e73;
    --ink-tertiary: #707076;
    --border: rgba(0,0,0,0.08);
    --border-strong: rgba(0,0,0,0.14);
    --accent: #0071e3;
    --accent-ink: #ffffff;
    --accent-soft: rgba(0,113,227,0.10);
    --accent-soft-strong: rgba(0,113,227,0.16);
    --purple: #8f35bc;
    --purple-soft: rgba(175,82,222,0.12);
    --success: #1f7a36;
    --success-soft: rgba(52,199,89,0.14);
    --warning: #b25000;
    --warning-soft: rgba(255,149,0,0.14);
    --danger: #d70015;
    --danger-soft: rgba(255,59,48,0.12);
    --neutral-soft: rgba(110,110,115,0.12);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05), 0 1px 1px rgba(0,0,0,0.04);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
    --shadow-lg: 0 24px 64px rgba(0,0,0,0.16), 0 4px 12px rgba(0,0,0,0.06);
    --radius-s: 10px;
    --radius-m: 16px;
    --radius-l: 22px;
    --radius-pill: 999px;
    --ease: cubic-bezier(.22,.9,.32,1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #000000;
      --bg-elevated: #0a0a0c;
      --surface: #1c1c1e;
      --surface-translucent: rgba(28,28,30,0.68);
      --surface-sunken: #131315;
      --ink: #f5f5f7;
      --ink-secondary: #98989d;
      --ink-tertiary: #8a8a8f;
      --border: rgba(255,255,255,0.09);
      --border-strong: rgba(255,255,255,0.16);
      --accent: #0a84ff;
      --accent-ink: #ffffff;
      --accent-soft: rgba(10,132,255,0.16);
      --accent-soft-strong: rgba(10,132,255,0.26);
      --purple: #bf5af2;
      --purple-soft: rgba(191,90,242,0.18);
      --success: #30d158;
      --success-soft: rgba(48,209,88,0.16);
      --warning: #ff9f0a;
      --warning-soft: rgba(255,159,10,0.16);
      --danger: #ff453a;
      --danger-soft: rgba(255,69,58,0.16);
      --neutral-soft: rgba(152,152,157,0.16);
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.6);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg: #000000;
    --bg-elevated: #0a0a0c;
    --surface: #1c1c1e;
    --surface-translucent: rgba(28,28,30,0.68);
    --surface-sunken: #131315;
    --ink: #f5f5f7;
    --ink-secondary: #98989d;
    --ink-tertiary: #8a8a8f;
    --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16);
    --accent: #0a84ff;
    --accent-ink: #ffffff;
    --accent-soft: rgba(10,132,255,0.16);
    --accent-soft-strong: rgba(10,132,255,0.26);
    --purple: #bf5af2;
    --purple-soft: rgba(191,90,242,0.18);
    --success: #30d158;
    --success-soft: rgba(48,209,88,0.16);
    --warning: #ff9f0a;
    --warning-soft: rgba(255,159,10,0.16);
    --danger: #ff453a;
    --danger-soft: rgba(255,69,58,0.16);
    --neutral-soft: rgba(152,152,157,0.16);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 8px 24px rgba(0,0,0,0.45);
    --shadow-lg: 0 24px 64px rgba(0,0,0,0.6);
    color-scheme: dark;
  }

  *,*::before,*::after{ box-sizing: border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    font-size: 14px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  h1,h2,h3,h4,p{ margin:0; }
  button{ font-family: inherit; }
  ::selection{ background: var(--accent-soft-strong); }

  /* Visible keyboard focus on every interactive element (buttons, nav, cards, chips, tabs) */
  button, [tabindex], a, .nav-item, .agent-card, .task-card, .doc-card, .create-agent-card,
  .filter-chip, .radio-card, .chip button, .switch input{
    outline: none;
  }
  button:focus-visible, [tabindex]:focus-visible, a:focus-visible, .nav-item:focus-visible,
  .agent-card:focus-visible, .task-card:focus-visible, .doc-card:focus-visible, .create-agent-card:focus-visible,
  .filter-chip:focus-visible, .radio-card:focus-visible,
  .switch input:focus-visible ~ .track{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 6px;
  }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-track{ background: transparent; }

  .icon{ display:inline-block; vertical-align:middle; stroke: currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; width:1em; height:1em; flex-shrink:0; }

  a{ color: inherit; }

  /* ============ App shell ============ */
  .app-shell{ display:flex; min-height:100vh; }

  .sidebar{
    width: 248px;
    flex: 0 0 248px;
    position: sticky;
    top:0;
    height: 100vh;
    background: var(--surface-translucent);
    backdrop-filter: blur(28px) saturate(1.6);
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    border-right: 1px solid var(--border);
    display:flex;
    flex-direction:column;
    padding: 20px 14px;
    gap: 4px;
    z-index: 40;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    padding: 6px 10px 20px;
  }
  .brand-mark{
    width:34px; height:34px; border-radius:10px;
    background: linear-gradient(155deg, var(--accent), var(--purple));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:17px; font-weight:700;
    box-shadow: var(--shadow-sm);
    flex-shrink:0;
  }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-text b{ font-size:15.5px; font-weight:650; letter-spacing:-0.01em; }
  .brand-text span{ font-size:11.5px; color: var(--ink-tertiary); }

  .mechanism-entry{
    display:flex; align-items:center; gap:8px;
    width:100%; margin: 2px 0 10px; padding: 8px 10px;
    border-radius: 11px; border: 1px dashed var(--border-strong);
    background: transparent; color: var(--ink-tertiary);
    font-size: 11.5px; font-weight: 560; cursor: pointer; text-align:left;
    transition: border-color .18s var(--ease), color .18s var(--ease), background .18s var(--ease);
  }
  .mechanism-entry .icon{ width:14px; height:14px; flex-shrink:0; color: var(--purple); }
  .mechanism-entry:hover{ border-color: var(--purple); color: var(--purple); background: var(--purple-soft); border-style:solid; }

  /* ============ Mechanism (ant / bee / wolf) ============ */

  .mech-modal-block{ margin-bottom:18px; }
  .mech-modal-block:last-child{ margin-bottom:0; }
  .mech-modal-block .head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .mech-modal-block .head .mark{ width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; }
  .mech-modal-block .head b{ font-size:13.5px; font-weight:650; }
  .mech-modal-block .head .tag{ font-size:11px; color: var(--ink-tertiary); }
  .mech-modal-block p{ font-size:12.5px; color: var(--ink-secondary); line-height:1.7; padding-left:42px; }
  .mech-quote{ margin-top:20px; padding:16px 18px; border-radius:14px; background: var(--surface-sunken); text-align:center; }
  .mech-quote .q{ font-size:15px; font-weight:650; letter-spacing:.02em; }
  .mech-quote .a{ font-size:11px; color: var(--ink-tertiary); margin-top:6px; }

  /* ---- 机制矩阵（场景 × 可用逻辑 × 落地方式 × 不可用逻辑）---- */
  .matrix-row{ padding:14px 2px; border-bottom:1px solid var(--border); }
  .matrix-row:first-child{ padding-top:0; }
  .matrix-row:last-child{ border-bottom:none; padding-bottom:0; }
  .matrix-row .scene{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .matrix-row .scene .idx{ font-size:10.5px; font-weight:700; color: var(--ink-tertiary); font-variant-numeric: tabular-nums; }
  .matrix-row .scene b{ font-size:13.5px; font-weight:650; }
  .matrix-row .scene .where{ font-size:10.5px; color: var(--ink-tertiary); background: var(--neutral-soft); padding:1.5px 8px; border-radius: var(--radius-pill); margin-left:auto; }
  .matrix-line{ display:flex; align-items:flex-start; gap:8px; font-size:12px; color: var(--ink-secondary); line-height:1.6; margin-bottom:6px; }
  .matrix-line .tag{ flex-shrink:0; font-size:10px; font-weight:700; padding:2px 8px; border-radius: var(--radius-pill); margin-top:1px; white-space:nowrap; }
  .matrix-line.use .tag{ background: var(--success-soft); color: var(--success); }
  .matrix-line.avoid .tag{ background: var(--danger-soft); color: var(--danger); }
  .matrix-land{ display:flex; align-items:flex-start; gap:5px; font-size:11.5px; color: var(--ink-tertiary); padding:7px 10px; margin:2px 0 8px; background: var(--surface-sunken); border-radius:9px; line-height:1.6; }
  .matrix-land .icon{ width:12px; height:12px; margin-top:3px; flex-shrink:0; }
  .mech-redline{ display:flex; gap:12px; align-items:flex-start; margin-top:6px; padding:15px 16px; border-radius:14px; background: var(--danger-soft); border:1px solid rgba(215,0,21,0.18); }
  .mech-redline .icon{ width:18px; height:18px; flex-shrink:0; color: var(--danger); margin-top:1px; }
  .mech-redline b{ font-size:12.5px; color: var(--danger); display:block; margin-bottom:4px; }
  .mech-redline span{ font-size:11.5px; color: var(--ink-secondary); line-height:1.65; }

  .lead-tag{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:650; padding:2.5px 9px 2.5px 7px; border-radius: var(--radius-pill); background: var(--purple-soft); color: var(--purple); }
  .lead-tag .icon{ width:10px; height:10px; }
  .trail-tag{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; color: var(--ink-tertiary); }
  .trail-tag .icon{ width:11px; height:11px; }
  .swarm-note{ display:flex; align-items:center; gap:6px; font-size:11px; color: var(--ink-tertiary); margin-bottom:8px; }
  .swarm-note .icon{ width:12px; height:12px; flex-shrink:0; color: var(--warning); }
  .swarm-note b{ color: var(--ink-secondary); font-weight:620; }

  /* ---- 认领意愿强度条：自主认领机制的动态累积值，不是算一次就定死的静态分数 ---- */
  @keyframes intentShimmer{ 0%{ background-position: 0 0; } 100%{ background-position: 40px 0; } }
  .intent-bar{ position:relative; height:6px; border-radius:4px; background: var(--neutral-soft); overflow:hidden; margin-top:6px; }
  .intent-bar .fill{ position:absolute; inset:0 auto 0 0; border-radius:4px; background: linear-gradient(90deg, var(--accent), var(--purple)); background-size: 200% 100%; }
  .intent-bar.animate .fill{ background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.22) 0 6px, transparent 6px 12px), linear-gradient(90deg, var(--accent), var(--purple)); animation: intentShimmer 1s linear infinite; }
  .intent-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px; color: var(--ink-tertiary); margin-top:4px; }
  .intent-row b{ color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
  .trace-hint{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:600; padding:1.5px 8px; border-radius: var(--radius-pill); }
  .trace-hint.boost{ background: var(--success-soft); color: var(--success); }
  .trace-hint.decay{ background: var(--neutral-soft); color: var(--ink-tertiary); }
  .trace-hint.downweight{ background: var(--danger-soft); color: var(--danger); }

  /* ---- 紧急度：未认领时长持续累积强度，非人工写死的高/中/低 ---- */
  .urgency-rail{ height:3px; border-radius:3px; background: var(--neutral-soft); margin:-1px -1px 10px; overflow:hidden; }
  .urgency-rail .fill{ height:100%; border-radius:3px; transition: width .3s var(--ease); }
  .urgency-row{ display:flex; align-items:center; gap:6px; font-size:10.5px; color: var(--ink-tertiary); margin-bottom:2px; }
  .urgency-row .icon{ width:11px; height:11px; flex-shrink:0; }
  .pin-btn{ margin-left:auto; border:none; background:transparent; color: var(--ink-tertiary); cursor:pointer; display:flex; align-items:center; gap:3px; font-size:10.5px; font-weight:600; padding:2px 6px; border-radius:6px; }
  .pin-btn:hover{ background: var(--neutral-soft); color: var(--ink); }
  .pin-btn.pinned{ color: var(--warning); }
  .pin-btn .icon{ width:11px; height:11px; }
  .pinned-tag{ display:inline-flex; align-items:center; gap:3px; font-size:10px; font-weight:700; color: var(--warning); background: var(--warning-soft); padding:2px 8px; border-radius: var(--radius-pill); }

  /* ---- 轻量执行单元：协作痕迹机制下的无状态执行单元，用完即释放，不占 Agent 中心名额 ---- */
  .light-unit{ display:flex; align-items:center; gap:8px; font-size:11.5px; color: var(--ink-tertiary); }
  .light-unit .mark{ width:22px; height:22px; border-radius:7px; background: var(--surface-sunken); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .light-unit .mark .icon{ width:12px; height:12px; }

  /* ---- 换人接棒 / 卡点攻坚小组 ---- */
  .plan-actions{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .squad-badge{ display:flex; align-items:center; gap:8px; margin-top:10px; padding:9px 11px; border-radius:11px; background: var(--purple-soft); }
  .squad-badge .who{ display:flex; }
  .squad-badge .who .avatar{ width:24px; height:24px; font-size:12px; border-radius:7px; margin-left:-6px; border:2px solid var(--surface); }
  .squad-badge .who .avatar:first-child{ margin-left:0; }
  .squad-badge .text{ font-size:11px; color: var(--purple); font-weight:600; flex:1; }
  .handoff-menu{ display:flex; flex-direction:column; gap:4px; margin-top:8px; padding:8px; border-radius:11px; background: var(--surface-sunken); }
  .handoff-opt{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:8px; border:none; background:transparent; cursor:pointer; text-align:left; font-family:inherit; font-size:12px; color:var(--ink); }
  .handoff-opt:hover{ background: var(--neutral-soft); }
  .handoff-opt .avatar{ width:24px; height:24px; font-size:12px; border-radius:7px; }

  .nav-group-label{
    font-size:11px; font-weight:600; color: var(--ink-tertiary);
    text-transform:uppercase; letter-spacing:0.04em;
    padding: 14px 12px 6px;
    /* 纯文本标签，不接收点击——避免在窄屏抽屉里覆盖下方 nav-item */
    pointer-events:none; user-select:none;
  }
  .nav-item{
    display:flex; align-items:center; gap:10px;
    padding: 8px 12px;
    border-radius: 10px;
    color: var(--ink-secondary);
    cursor:pointer;
    font-size: 13.5px;
    font-weight: 500;
    border:none; background:transparent; text-align:left; width:100%;
    transition: background .18s var(--ease), color .18s var(--ease);
  }
  .nav-item .icon{ width:18px; height:18px; flex-shrink:0; }
  .nav-item:hover{ background: var(--neutral-soft); color: var(--ink); }
  .nav-item.active{ background: var(--accent); color: #fff; box-shadow: var(--shadow-sm); }
  .nav-item .count{
    margin-left:auto; font-size:11px; font-weight:600;
    color: var(--ink-tertiary); background: var(--neutral-soft);
    padding: 1px 7px; border-radius: 20px;
  }
  .nav-item.active .count{ background: rgba(255,255,255,0.25); color:#fff; }

  .sidebar-foot{
    margin-top:auto; padding: 10px 12px 4px;
    display:flex; align-items:center; gap:10px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
  }
  .theme-toggle{
    display:flex; gap:4px; background: var(--neutral-soft); padding:3px; border-radius: 10px; margin-top: 8px;
  }
  .theme-toggle button{
    flex:1; border:none; background:transparent; padding:6px 0; border-radius:7px;
    color: var(--ink-secondary); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .theme-toggle button.active{ background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }
  .theme-resolved{ opacity:.55; font-size:10.5px; margin-left:1px; }

  .user-chip{ display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:10px; }
  .user-chip .avatar{ width:26px; height:26px; font-size:13px; }
  .user-chip b{ font-size:12.5px; }
  .user-chip span{ font-size:11px; color: var(--ink-tertiary); }

  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    position: sticky; top:0; z-index:30;
    display:flex; align-items:center; gap:16px;
    padding: 16px 32px;
    background: var(--surface-translucent);
    backdrop-filter: blur(24px) saturate(1.5);
    -webkit-backdrop-filter: blur(24px) saturate(1.5);
    border-bottom: 1px solid var(--border);
  }
  .topbar h1{ font-size: 22px; font-weight: 650; letter-spacing:-0.015em; text-wrap: balance; }
  .topbar .sub{ font-size:12.5px; color: var(--ink-tertiary); margin-top:2px; }
  .topbar-actions{ margin-left:auto; display:flex; gap:10px; align-items:center; }

  .search-box{
    display:flex; align-items:center; gap:7px;
    background: var(--neutral-soft); border-radius: 10px; padding:7px 10px;
    color: var(--ink-tertiary); font-size:13px; min-width:200px;
  }
  .search-box input{ border:none; background:transparent; outline:none; color:var(--ink); font-size:13px; width:100%; font-family:inherit; }
  .search-box .icon{ width:15px; height:15px; flex-shrink:0; }

  .view{ padding: 26px 32px 60px; max-width: 1320px; }
  .view[hidden]{ display:none; }
  @keyframes viewIn{ from{ opacity:0; transform: translateY(6px); } to{ opacity:1; transform:none; } }
  .view{ animation: viewIn .32s var(--ease); }

  /* ============ Buttons / form atoms ============ */
  .btn{
    display:inline-flex; align-items:center; gap:6px; justify-content:center;
    border-radius: var(--radius-pill); border:1px solid transparent;
    padding: 8px 16px; font-size:13.5px; font-weight:560; cursor:pointer;
    transition: transform .15s var(--ease), background .15s var(--ease), box-shadow .15s var(--ease);
    white-space:nowrap;
  }
  .btn .icon{ width:15px; height:15px; }
  .btn:active{ transform: scale(0.96); }
  .btn-primary{ background: var(--accent); color:#fff; box-shadow: var(--shadow-sm); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-secondary{ background: var(--neutral-soft); color: var(--ink); }
  .btn-secondary:hover{ background: var(--border-strong); }
  .btn-ghost{ background:transparent; color: var(--ink-secondary); border-color: var(--border); }
  .btn-ghost:hover{ background: var(--neutral-soft); color: var(--ink); }
  .btn-sm{ padding:5px 12px; font-size:12.5px; }
  .btn-icon{ width:32px; height:32px; padding:0; border-radius:50%; background: var(--neutral-soft); color: var(--ink-secondary); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .btn-icon:hover{ background: var(--border-strong); color:var(--ink); }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  label.field-label{ font-size:12.5px; font-weight:600; color: var(--ink-secondary); display:block; margin-bottom:6px; }
  .input, textarea.input, select.input{
    width:100%; background: var(--neutral-soft); border:1px solid transparent; border-radius: 11px;
    padding:9px 12px; font-size:13.5px; color: var(--ink); outline:none; font-family:inherit;
    transition: background .15s, border-color .15s;
  }
  .input:focus, textarea.input:focus, select.input:focus{ background: var(--surface); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  textarea.input{ resize:vertical; min-height:64px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field-row{ display:flex; gap:14px; }
  .field-row .field{ flex:1; }
  .hint{ font-size:11.5px; color: var(--ink-tertiary); margin-top:5px; }

  .tag-input{ display:flex; flex-wrap:wrap; gap:6px; background: var(--neutral-soft); border-radius:11px; padding:8px; min-height:40px; }
  .tag-input input{ border:none; background:transparent; outline:none; flex:1; min-width:80px; font-size:13px; color:var(--ink); font-family:inherit; padding:3px; }
  .chip{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:560;
    padding: 3px 10px; border-radius: var(--radius-pill); background: var(--accent-soft); color: var(--accent);
  }
  .chip button{ border:none; background:transparent; color:inherit; cursor:pointer; padding:0; display:flex; opacity:.7; }
  .chip button:hover{ opacity:1; }
  .chip.tone-purple{ background: var(--purple-soft); color: var(--purple); }
  .chip.tone-neutral{ background: var(--neutral-soft); color: var(--ink-secondary); }

  .toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); }
  .toggle-row:last-child{ border-bottom:none; }
  .toggle-row .meta{ display:flex; gap:10px; align-items:flex-start; }
  .toggle-row .meta .icon-badge{ width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--neutral-soft); flex-shrink:0; }
  .toggle-row .meta .icon-badge .icon{ width:16px; height:16px; }
  .toggle-row .meta b{ font-size:13px; font-weight:600; display:block; }
  .toggle-row .meta span{ font-size:11.5px; color: var(--ink-tertiary); }
  .toggle-row .meta .origin-tag{ font-size:9.5px; font-weight:700; letter-spacing:.02em; padding:1.5px 6px; border-radius:var(--radius-pill); margin-left:5px; vertical-align:middle; color:var(--accent); background:var(--accent-soft); }
  .toggle-row .meta .origin-tag.tone-success{ color:var(--success); background:var(--success-soft); }
  .toggle-row .meta .origin-tag.tone-purple{ color:var(--purple); background:var(--purple-soft); }
  .toggle-row .meta .permission-tag{ display:flex; align-items:center; gap:4px; font-size:10.5px; color:var(--ink-tertiary); margin-top:3px; }
  .toggle-row .meta .permission-tag .icon{ width:11px; height:11px; flex-shrink:0; }
  .skill-panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; flex-wrap:wrap; gap:8px; }
  .skill-source-tabs{ display:flex; gap:3px; background:var(--neutral-soft); padding:3px; border-radius:9px; }
  .skill-tab{ border:none; background:transparent; padding:5px 11px; border-radius:7px; font-size:11.5px; font-weight:600; color:var(--ink-secondary); cursor:pointer; }
  .skill-tab.active{ background:var(--surface); color:var(--ink); box-shadow:var(--shadow-sm); }
  .toggle-row .del-btn{ width:26px; height:26px; border-radius:50%; border:none; background:transparent; color: var(--ink-tertiary); cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .toggle-row .del-btn:hover{ background: var(--danger-soft); color: var(--danger); }
  .toggle-row .del-btn .icon{ width:14px; height:14px; }
  .toggle-row .row-actions{ display:flex; align-items:center; gap:6px; }
  .install-row{ display:flex; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); }
  .install-row input.input{ flex:1; }
  .skill-upload-form{ display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:11px; background: var(--surface-sunken); margin-bottom:10px; }
  .skill-upload-form .field-row{ gap:8px; }
  .mock-note{ display:flex; align-items:flex-start; gap:6px; font-size:11px; color: var(--ink-tertiary); line-height:1.6; padding:8px 2px; }
  .mock-note .icon{ width:12px; height:12px; margin-top:2px; flex-shrink:0; }

  /* ---- 模型接入：提供方卡片 + 向导里按提供方分组的模型选择 ---- */
  .provider-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap:16px; }
  .provider-card{ padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .provider-card.is-disabled{ opacity:.62; }
  .provider-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .provider-title{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .provider-title b{ font-size:14.5px; font-weight:650; }
  .provider-meta{ display:flex; flex-direction:column; gap:6px; }
  .provider-meta-row{ display:flex; align-items:center; gap:7px; font-size:11.5px; color: var(--ink-tertiary); }
  .provider-meta-row .icon{ width:13px; height:13px; flex-shrink:0; }
  .provider-meta-row .k{ width:58px; flex-shrink:0; }
  .provider-meta-row code{ font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; color: var(--ink-secondary); background: var(--surface-sunken); padding:2px 7px; border-radius:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .provider-models{ display:flex; flex-wrap:wrap; gap:6px; }
  .provider-foot{ display:flex; align-items:center; gap:6px; padding-top:10px; border-top:1px solid var(--border); flex-wrap:wrap; }

  .model-provider-group{ margin-bottom:14px; }
  .model-provider-group:last-child{ margin-bottom:0; }
  .model-provider-label{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:640; color: var(--ink-secondary); margin-bottom:8px; }
  .model-provider-label .icon{ width:13px; height:13px; color: var(--ink-tertiary); }
  .radio-card-group.model-group{ flex-wrap:wrap; }
  .radio-card-group.model-group .radio-card{ flex: 1 1 180px; }
  .switch{ position:relative; width:40px; height:24px; flex-shrink:0; }
  .switch input{ opacity:0; width:100%; height:100%; margin:0; position:absolute; cursor:pointer; z-index:1; }
  .switch .track{ position:absolute; inset:0; background: var(--border-strong); border-radius:20px; transition: background .2s var(--ease); }
  .switch .thumb{ position:absolute; top:2px; left:2px; width:20px; height:20px; background:#fff; border-radius:50%; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s var(--ease); }
  .switch input:checked ~ .track{ background: var(--success); }
  .switch input:checked ~ .thumb{ transform: translateX(16px); }

  .radio-card-group{ display:flex; gap:10px; }
  .radio-card{ flex:1; border:1.5px solid var(--border); border-radius: 12px; padding:10px 12px; cursor:pointer; }
  .radio-card b{ font-size:12.5px; display:block; }
  .radio-card span{ font-size:11px; color: var(--ink-tertiary); }
  .radio-card.selected{ border-color: var(--accent); background: var(--accent-soft); }

  /* ============ Cards / pills / avatars ============ */
  .card{ background: var(--surface); border:1px solid var(--border); border-radius: var(--radius-l); box-shadow: var(--shadow-sm); }

  .avatar{
    width:42px; height:42px; border-radius: 12px;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex-shrink:0;
    background: var(--neutral-soft);
  }
  .avatar.round{ border-radius:50%; }

  .pill{
    display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:620;
    padding: 3px 9px 3px 7px; border-radius: var(--radius-pill);
  }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background: currentColor; }
  .pill.st-idle{ background: var(--neutral-soft); color: var(--ink-secondary); }
  .pill.st-working{ background: var(--success-soft); color: var(--success); }
  .pill.st-offline{ background: var(--neutral-soft); color: var(--ink-tertiary); }
  .pill.st-open{ background: var(--accent-soft); color: var(--accent); }
  .pill.st-planning{ background: var(--purple-soft); color: var(--purple); }
  .pill.st-review{ background: var(--warning-soft); color: var(--warning); }
  .pill.st-done{ background: var(--success-soft); color: var(--success); }
  .pill.st-high{ background: var(--danger-soft); color: var(--danger); }
  .pill.st-mid{ background: var(--warning-soft); color: var(--warning); }
  .pill.st-low{ background: var(--neutral-soft); color: var(--ink-secondary); }

  .skill-chip{ font-size:11px; font-weight:560; padding:2.5px 9px; border-radius: var(--radius-pill); background: var(--neutral-soft); color: var(--ink-secondary); }

  /* ============ Overview ============ */
  .stat-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(210px,1fr)); gap:16px; margin-bottom:26px; }
  .stat-card{ padding:20px 22px; display:flex; flex-direction:column; gap:10px; }
  .stat-card .top{ display:flex; align-items:center; justify-content:space-between; }
  .stat-card .icon-badge{ width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .stat-card .icon-badge .icon{ width:17px; height:17px; }
  .stat-card .value{ font-size:32px; font-weight:680; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; }
  .stat-card .label{ font-size:12.5px; color: var(--ink-tertiary); }
  .stat-card .delta{ font-size:11.5px; font-weight:600; }
  .stat-card .delta.up{ color: var(--success); }
  .stat-card .delta.flat{ color: var(--ink-tertiary); }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin: 30px 0 14px; }
  .section-head h2{ font-size:18px; font-weight:640; letter-spacing:-0.01em; }
  .section-head .link{ font-size:12.5px; color: var(--accent); cursor:pointer; font-weight:560; }

  .two-col{ display:grid; grid-template-columns: 1.4fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 980px){ .two-col{ grid-template-columns: 1fr; } }

  .timeline{ display:flex; flex-direction:column; }
  .timeline-item{ display:flex; gap:12px; padding: 12px 4px; position:relative; }
  .timeline-item .rail{ display:flex; flex-direction:column; align-items:center; }
  .timeline-item .dot{ width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0; }
  .timeline-item .line{ flex:1; width:1.5px; background: var(--border); margin-top:4px; min-height:16px; }
  .timeline-item:last-child .line{ display:none; }
  .timeline-item .content{ flex:1; padding-bottom:2px; }
  .timeline-item .content .head{ font-size:13px; }
  .timeline-item .content .head b{ font-weight:620; }
  .timeline-item .content .time{ font-size:11px; color: var(--ink-tertiary); margin-top:2px; }
  .timeline-item .content .doc-ref{ display:inline-flex; align-items:center; gap:5px; margin-top:6px; font-size:11.5px; padding:4px 9px; border-radius:8px; background: var(--neutral-soft); color: var(--ink-secondary); }
  .timeline-item .content .doc-ref .icon{ width:12px; height:12px; }

  .agent-mini-list{ display:flex; flex-direction:column; gap:2px; }
  .agent-mini{ display:flex; align-items:center; gap:10px; padding:9px 6px; border-radius:10px; cursor:pointer; }
  .agent-mini:hover{ background: var(--neutral-soft); }
  .agent-mini .avatar{ width:32px; height:32px; font-size:15px; border-radius:9px; }
  .agent-mini .info b{ font-size:12.5px; display:block; }
  .agent-mini .info span{ font-size:11px; color: var(--ink-tertiary); }
  .agent-mini .stat{ margin-left:auto; text-align:right; }
  .agent-mini .stat b{ font-size:12.5px; font-variant-numeric: tabular-nums; }
  .agent-mini .stat span{ font-size:10.5px; color: var(--ink-tertiary); display:block; }

  /* ============ Agents grid ============ */
  .toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .filter-chip{ font-size:12.5px; font-weight:560; padding:6px 13px; border-radius: var(--radius-pill); background: var(--neutral-soft); color: var(--ink-secondary); cursor:pointer; border:1.5px solid transparent; }
  .filter-chip.active{ background: var(--accent-soft); color: var(--accent); border-color: var(--accent-soft-strong); }

  .agent-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(268px, 1fr)); gap:16px; }
  .agent-card{ padding:20px; cursor:pointer; transition: transform .18s var(--ease), box-shadow .18s var(--ease); display:flex; flex-direction:column; gap:14px; }
  .agent-card:hover{ transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .agent-card .head{ display:flex; align-items:center; gap:12px; }
  .agent-card .avatar{ width:46px; height:46px; font-size:22px; border-radius:13px; }
  .agent-card .head b{ font-size:14.5px; font-weight:640; display:block; }
  .agent-card .head .role{ font-size:12px; color: var(--ink-tertiary); margin-top:1px; }
  .agent-card .desc{ font-size:12px; color: var(--ink-secondary); line-height:1.55; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .agent-card .skills{ display:flex; flex-wrap:wrap; gap:6px; }
  .agent-card .foot{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:12px; border-top:1px solid var(--border); font-size:11.5px; color: var(--ink-tertiary); }
  .agent-card .foot .metric{ display:flex; align-items:center; gap:4px; font-variant-numeric: tabular-nums; }
  .agent-card .foot .metric .icon{ width:12.5px; height:12.5px; }

  .create-agent-card{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:20px; border:1.5px dashed var(--border-strong); border-radius: var(--radius-l); cursor:pointer; color: var(--ink-tertiary); min-height:190px; transition: border-color .18s, color .18s, background .18s; }
  .create-agent-card:hover{ border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .create-agent-card .plus-circle{ width:40px; height:40px; border-radius:50%; background: var(--neutral-soft); display:flex; align-items:center; justify-content:center; }
  .create-agent-card:hover .plus-circle{ background: var(--accent-soft-strong); }

  /* ---- 团队卡片 ---- */
  .team-owner{ display:flex; align-items:center; gap:8px; padding:9px 11px; border-radius:11px; background: var(--purple-soft); }
  .team-owner b{ font-size:12.5px; font-weight:650; }
  .team-owner .hint{ margin:0; font-size:11px; }
  .team-owner .avatar{ width:24px; height:24px; font-size:12px; border-radius:7px; }
  .team-members{ display:flex; flex-wrap:wrap; gap:6px; }
  .team-member-chip{ display:inline-flex; align-items:center; gap:5px; padding:2px 8px 2px 3px; border-radius: var(--radius-pill); background: var(--neutral-soft); font-size:11.5px; }
  .team-member-chip .avatar{ width:20px; height:20px; font-size:10px; border-radius:5px; }

  /* ---- 团队模式条：任务详情顶部说明 + 任务卡上的小标签 ---- */
  .team-mode-banner{ display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:12px; background: var(--purple-soft); margin-bottom:16px; }
  .team-mode-banner .icon{ color: var(--purple); flex-shrink:0; }
  .team-mode-banner b{ color: var(--purple); font-weight:650; }
  .team-mode-tag{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:650; padding:1.5px 8px; border-radius: var(--radius-pill); background: var(--purple-soft); color: var(--purple); }
  .team-mode-tag .icon{ width:11px; height:11px; }
  .assign-inline{ margin-top:6px; display:flex; align-items:center; gap:6px; font-size:11.5px; }
  .assign-inline select{ padding:3px 8px; border-radius:8px; background: var(--surface-sunken); border:1px solid var(--border); font: inherit; color: var(--ink); }

  /* ============ Task board ============ */
  .board{ display:grid; grid-template-columns: repeat(5, minmax(198px,1fr)); gap:14px; overflow-x:auto; padding-bottom:10px; }
  @media (max-width: 1400px){ .board{ grid-auto-columns: 78%; grid-auto-flow:column; grid-template-columns:none; } }
  @media (max-width: 620px){ .board{ grid-auto-columns: 88%; } }
  .board-col{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .board-col-head{ display:flex; align-items:center; gap:8px; padding:2px 4px; }
  .board-col-head .dot{ width:8px; height:8px; border-radius:50%; }
  .board-col-head b{ font-size:12.5px; font-weight:650; }
  .board-col-head .n{ margin-left:auto; font-size:11px; color: var(--ink-tertiary); font-variant-numeric: tabular-nums; }
  .board-col-body{ display:flex; flex-direction:column; gap:10px; min-height:60px; }

  .task-card{ padding:14px 15px; cursor:pointer; display:flex; flex-direction:column; gap:10px; transition: transform .16s var(--ease), box-shadow .16s var(--ease); }
  .task-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .task-card .title{ font-size:13px; font-weight:610; line-height:1.4; text-wrap:pretty; }
  .task-card .tags{ display:flex; flex-wrap:wrap; gap:5px; }
  .task-card .assignees{ display:flex; align-items:center; }
  .task-card .assignees .avatar{ width:24px; height:24px; font-size:12px; border-radius:7px; margin-left:-6px; border:2px solid var(--surface); }
  .task-card .assignees .avatar:first-child{ margin-left:0; }
  .task-card .foot{ display:flex; align-items:center; justify-content:space-between; }
  .task-card .foot .due{ font-size:11px; color: var(--ink-tertiary); display:flex; align-items:center; gap:4px; }
  .task-card .foot .due .icon{ width:12px; height:12px; }

  .match-banner{ display:flex; align-items:center; gap:8px; background: var(--accent-soft); color: var(--accent); border-radius:10px; padding:7px 10px; font-size:11.5px; font-weight:600; font-family:inherit; width:100%; border:none; cursor:pointer; }
  .match-banner .icon{ width:13px; height:13px; flex-shrink:0; }
  /* 认领意愿的强度直接烤进 banner 的底色渐变里，不用另起一条重复的进度条 */
  .match-banner.intent-fill{ background: linear-gradient(90deg, var(--accent-soft-strong) 0%, var(--accent-soft-strong) var(--intent), var(--accent-soft) var(--intent), var(--accent-soft) 100%); }
  .match-expand-icon{ margin-left:auto; display:flex; transition: transform .18s var(--ease); }
  .match-expand-icon .icon{ width:13px; height:13px; }
  .match-banner.open .match-expand-icon{ transform: rotate(180deg); }
  .match-detail{ display:flex; flex-direction:column; gap:8px; padding:2px 1px 2px; }
  .match-candidate-row{ display:flex; flex-direction:column; gap:7px; padding:9px 10px; border-radius:11px; background: var(--surface-sunken); }
  .match-candidate-row .who{ display:flex; align-items:center; gap:8px; }
  .match-candidate-row .who .avatar{ width:26px; height:26px; font-size:13px; border-radius:7px; }
  .match-candidate-row .who b{ font-size:12px; font-weight:620; display:block; }
  .match-candidate-row .who span{ font-size:10.5px; color: var(--ink-tertiary); }
  .contract-chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .contract-chip{ font-size:10px; font-weight:560; padding:2px 8px; border-radius: var(--radius-pill); background: var(--neutral-soft); color: var(--ink-tertiary); display:inline-flex; align-items:center; gap:3px; }
  .contract-chip.hit{ background: var(--success-soft); color: var(--success); }
  .contract-chip .icon{ width:9px; height:9px; }
  .claim-btn{ width:100%; }
  .claim-btn.claiming{ background: var(--success); }
  .claim-pulse{ position:relative; overflow:hidden; }
  @keyframes claimFlash{ 0%{ box-shadow: 0 0 0 0 var(--accent-soft-strong);} 100%{ box-shadow: 0 0 0 10px rgba(0,113,227,0); } }
  .claim-flash{ animation: claimFlash .7s var(--ease); }

  /* ============ Task detail ============ */
  .role-tabs{ display:inline-flex; gap:3px; background:var(--neutral-soft); padding:3px; border-radius:11px; }

  .progress-ring-wrap span{ font-size:11px; color: var(--ink-tertiary); display:block; }

  .detail-grid{ display:grid; grid-template-columns: 1.15fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 1020px){ .detail-grid{ grid-template-columns:1fr; } }

  .panel{ padding:20px 22px; margin-bottom:20px; }
  .panel-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .panel-head h3{ font-size:14.5px; font-weight:640; display:flex; align-items:center; gap:7px; }
  .panel-head h3 .icon{ width:16px; height:16px; color: var(--accent); }

  .plan-step{ display:flex; gap:12px; padding: 11px 2px; }
  .plan-step .check{ width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
  .plan-step .check .icon{ width:13px; height:13px; }
  .plan-step.done .check{ background: var(--success); color:#fff; }
  .plan-step.active .check{ background: var(--accent-soft-strong); color: var(--accent); border:2px solid var(--accent); }
  .plan-step.pending .check{ background: var(--neutral-soft); color: var(--ink-tertiary); border:2px solid var(--border-strong); }
  .plan-step .body{ flex:1; }
  .plan-step .body .title{ font-size:13px; font-weight:600; }
  .plan-step.done .body .title{ color: var(--ink-secondary); text-decoration: line-through; text-decoration-color: var(--border-strong); text-decoration-thickness: 1.5px; }
  .plan-step .body .who{ display:flex; align-items:center; gap:6px; margin-top:5px; font-size:11.5px; color: var(--ink-tertiary); }
  .plan-step .body .who .avatar{ width:18px; height:18px; font-size:10px; border-radius:5px; }
  .plan-step .connector{ position:relative; }
  .plan-step:not(:last-child) .check{ position:relative; }
  .plan-step:not(:last-child) .check::after{ content:""; position:absolute; top:24px; left:50%; width:1.5px; height:calc(100% + 2px); background: var(--border); transform: translateX(-50%); }

  .log-feed{ display:flex; flex-direction:column; gap:2px; max-height: 420px; overflow-y:auto; padding-right:4px; }
  .log-item{ display:flex; gap:10px; padding:10px 2px; }
  .log-item .avatar{ width:28px; height:28px; font-size:14px; border-radius:8px; flex-shrink:0; }
  .log-item .bubble{ flex:1; background: var(--surface-sunken); border-radius: 12px; padding:9px 12px; }
  .log-item .bubble .who{ font-size:12px; font-weight:650; margin-bottom:2px; }
  .log-item .bubble .who .role-tag{ font-weight:500; color: var(--ink-tertiary); margin-left:5px; }
  .log-item .bubble .text{ font-size:12.5px; color: var(--ink-secondary); line-height:1.55; }
  .log-item .bubble .time{ font-size:10.5px; color: var(--ink-tertiary); margin-top:5px; }
  .log-item .bubble .doc-chip{ display:inline-flex; align-items:center; gap:6px; margin-top:8px; padding:6px 10px; border-radius:9px; background: var(--surface); border:1px solid var(--border); font-size:11.5px; cursor:pointer; }
  .log-item .bubble .doc-chip:hover{ border-color: var(--accent); color: var(--accent); }

  .log-item.system .bubble .text{ font-size:11px; color: var(--ink-tertiary); }
  .typing-dots{ display:inline-flex; gap:3px; align-items:center; padding: 4px 0; }
  .typing-dots span{ width:5px; height:5px; border-radius:50%; background: var(--ink-tertiary); animation: typingBounce 1.1s infinite ease-in-out; }
  .typing-dots span:nth-child(2){ animation-delay:.15s; } .typing-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes typingBounce{ 0%,60%,100%{ transform: translateY(0); opacity:.5; } 30%{ transform: translateY(-3px); opacity:1; } }

  .doc-preview-card{ display:flex; gap:12px; padding:13px; border:1px solid var(--border); border-radius:14px; cursor:pointer; transition: border-color .15s, background .15s; }
  .doc-preview-card:hover{ border-color: var(--accent); background: var(--accent-soft); }
  .doc-preview-card .thumb{ width:42px; height:52px; border-radius:6px; background: var(--surface-sunken); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .doc-preview-card .thumb .icon{ width:20px; height:20px; }
  .doc-preview-card .info b{ font-size:12.5px; display:block; text-wrap:pretty; }
  .doc-preview-card .info span{ font-size:11px; color: var(--ink-tertiary); }

  .team-roster{ display:flex; flex-direction:column; gap:10px; }
  .roster-item{ display:flex; align-items:center; gap:10px; }

  .roster-item .info{ flex:1; min-width:0; }
  .roster-item .info b{ font-size:12.5px; display:block; }
  .roster-item .info span{ font-size:11px; color: var(--ink-tertiary); }

  /* ============ Documents library ============ */
  .doc-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
  .doc-card{ padding:18px; cursor:pointer; transition: transform .16s var(--ease), box-shadow .16s var(--ease); }

  .doc-card .top{ display:flex; gap:12px; align-items:flex-start; margin-bottom:14px; }
  .doc-card .filetype{ width:40px; height:48px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .doc-card .filetype .icon{ width:19px; height:19px; }
  .doc-card .title{ font-size:13px; font-weight:620; line-height:1.4; text-wrap:pretty; }
  .doc-card .task-src{ font-size:11px; color: var(--ink-tertiary); margin-top:3px; }
  .doc-card .foot{ display:flex; align-items:center; justify-content:space-between; padding-top:12px; border-top:1px solid var(--border); }
  .doc-card .author{ display:flex; align-items:center; gap:6px; font-size:11.5px; color: var(--ink-secondary); }
  .doc-card .author .avatar{ width:20px; height:20px; font-size:11px; border-radius:6px; }
  .doc-card .date{ font-size:11px; color: var(--ink-tertiary); }

  .doc-project-group{ margin-bottom:28px; }
  .doc-project-group:last-child{ margin-bottom:0; }
  .doc-project-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; background:transparent; border:none; padding:4px 2px; cursor:pointer; font-family:inherit; width:100%; text-align:left; }
  .doc-project-head b{ font-size:14px; font-weight:640; color:var(--ink); text-wrap:pretty; }
  .doc-project-head:hover b{ color:var(--accent); }
  .doc-project-count{ margin-left:auto; font-size:11.5px; color:var(--ink-tertiary); display:flex; align-items:center; gap:2px; flex-shrink:0; white-space:nowrap; }
  .doc-project-count .icon{ width:12px; height:12px; }

  /* ============ Modal / Drawer ============ */
  .overlay{ position:fixed; inset:0; background: rgba(0,0,0,0.42); backdrop-filter: blur(6px); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; opacity:0; pointer-events:none; transition: opacity .22s var(--ease); }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .modal{ background: var(--surface); border-radius: var(--radius-l); box-shadow: var(--shadow-lg); width:100%; max-width:560px; max-height:88vh; overflow-y:auto; transform: translateY(14px) scale(.97); opacity:0; transition: transform .28s var(--ease), opacity .24s var(--ease); border: 1px solid var(--border); }
  .overlay.open .modal{ transform:none; opacity:1; }

  .modal-head{ position:sticky; top:0; background: var(--surface-translucent); backdrop-filter: blur(20px); display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); z-index:2; }
  .modal-head h3{ font-size:16px; font-weight:650; }
  .modal-body{ padding:22px; }
  .modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); position:sticky; bottom:0; background: var(--surface-translucent); backdrop-filter: blur(20px); }
  .modal-foot .icon-prev{ transform: rotate(180deg); }

  /* ---- Agent 创建/编辑向导 ---- */
  .wizard-rail{ display:flex; align-items:center; padding:16px 22px 4px; gap:0; overflow-x:auto; }
  .wizard-step{ display:flex; align-items:center; gap:7px; flex-shrink:0; color: var(--ink-tertiary); }
  .wizard-step .dot{ width:22px; height:22px; border-radius:50%; background: var(--neutral-soft); display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:700; flex-shrink:0; }
  .wizard-step .dot .icon{ width:11px; height:11px; }
  .wizard-step span{ font-size:11.5px; font-weight:600; white-space:nowrap; }
  .wizard-step.active{ color: var(--ink); }
  .wizard-step.active .dot{ background: var(--accent); color:#fff; }
  .wizard-step.done .dot{ background: var(--success); color:#fff; }
  .wizard-step.done span{ color: var(--ink-secondary); }
  .wizard-line{ width:20px; height:1.5px; background: var(--border-strong); margin:0 6px; flex-shrink:0; }
  .review-block{ margin-bottom:16px; }
  .review-block h4{ font-size:11px; font-weight:700; color: var(--ink-tertiary); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .review-row{ display:flex; gap:10px; padding:6px 0; font-size:12.5px; border-bottom:1px solid var(--border); }
  .review-row:last-child{ border-bottom:none; }
  .review-row .k{ width:110px; flex-shrink:0; color: var(--ink-tertiary); }
  .review-row .v{ color: var(--ink); flex:1; }

  .emoji-grid{ display:grid; grid-template-columns: repeat(8, 1fr); gap:6px; }
  .emoji-opt{ aspect-ratio:1; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; background: var(--neutral-soft); border:2px solid transparent; }
  .emoji-opt.selected{ border-color: var(--accent); background: var(--accent-soft); }

  .drawer-agent-head{ display:flex; gap:14px; align-items:center; margin-bottom:18px; }
  .drawer-agent-head .avatar{ width:56px; height:56px; font-size:26px; border-radius:15px; }
  .drawer-agent-head h3{ font-size:18px; font-weight:650; }
  .drawer-agent-head .role{ font-size:12.5px; color: var(--ink-tertiary); margin-top:2px; }
  .stat-row{ display:flex; gap:10px; margin-bottom:20px; }
  .stat-row .mini-stat{ flex:1; background: var(--surface-sunken); border-radius:12px; padding:12px; text-align:center; }
  .stat-row .mini-stat b{ font-size:18px; font-variant-numeric: tabular-nums; display:block; }
  .stat-row .mini-stat span{ font-size:10.5px; color: var(--ink-tertiary); }

  .toast-stack{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .toast{ display:flex; align-items:center; gap:10px; background: var(--surface); border:1px solid var(--border); box-shadow: var(--shadow-lg); border-radius:14px; padding:12px 16px; font-size:12.5px; font-weight:560; transform: translateX(20px); opacity:0; animation: toastIn .3s var(--ease) forwards; max-width:320px; }
  .toast .icon-badge{ width:26px; height:26px; border-radius:50%; background: var(--success-soft); color: var(--success); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .toast .icon-badge .icon{ width:14px; height:14px; }
  @keyframes toastIn{ to{ transform:none; opacity:1; } }
  @keyframes toastOut{ to{ transform: translateX(20px); opacity:0; } }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:50px 20px; text-align:center; color: var(--ink-tertiary); gap:10px; }

  .menu-toggle{ display:none; background:var(--neutral-soft); border:none; width:34px; height:34px; border-radius:9px; align-items:center; justify-content:center; cursor:pointer; color:var(--ink); flex-shrink:0; }
  .sidebar-scrim{ display:none; position:fixed; inset:0; background:rgba(0,0,0,0.38); z-index:39; opacity:0; pointer-events:none; transition: opacity .25s var(--ease); }

    .sidebar-scrim{ display:block; }
    .view{ padding: 20px 16px 50px; }
    .topbar{ padding:14px 16px; flex-wrap:wrap; row-gap:10px; }
    .topbar-title-block{ flex:1 1 auto; min-width:0; }

  @media (max-width: 640px){

    .create-agent-card{ min-height:140px; padding:18px; }
    .two-col{ gap:14px; }
    .detail-grid{ gap:14px; }
    .field-row{ flex-direction:column; gap:10px; }

    .radio-card-group{ grid-template-columns:1fr !important; }
    .board-col{ min-width:0; }
    .overlay{ padding:0; align-items:flex-end; }
    .modal{ max-width:100%; width:100%; max-height:94vh; height:94vh; border-radius: 18px 18px 0 0; }
    .modal.wide{ max-width:100%; }
    .modal-head{ padding:14px 16px; }
    .modal-head h3{ font-size:15.5px; }
    .modal-body{ padding:16px; }
    .modal-foot{ padding:12px 16px; flex-wrap:wrap; row-gap:8px; }
    .modal-foot .btn{ flex:1 1 auto; min-width:44%; }
    .wizard-rail{ padding:12px 16px 2px; gap:0; }
    .wizard-step span{ display:none; }
    .wizard-step.active span{ display:inline; }
    .wizard-line{ width:12px; margin:0 4px; }
    /* 触控目标 ≥44px */
    .nav-item, .btn, .filter-chip, .skill-tab{ min-height:40px; }
    .btn-sm{ min-height:34px; }
    /* 顶栏在窄屏只留一个主按钮，其他隐藏 */
    .topbar-actions .btn.mobile-hide{ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: .001s !important; transition-duration: .001s !important; }
  }

  /* Fallback for browsers/renderers without backdrop-filter support: keep translucent
     surfaces fully legible with a solid background instead of a see-through one. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    .sidebar, .topbar, .modal-head, .modal-foot{ background: var(--surface) !important; }
    .overlay{ background: rgba(0,0,0,0.56) !important; }
  }
</style>

function switchView(view, opts={}){
  State.view = view;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  const t = TOPBAR_TEXT[view];
  document.getElementById('topbar-title').textContent = t.title;
  document.getElementById('topbar-sub').textContent = t.sub();
  if(window.innerWidth <= 880) closeSidebar();
  renderView(opts);
}

function renderView(opts={}){
  const root = document.getElementById('view-root');
  if(State.view==='overview') root.innerHTML = renderOverview();
  else if(State.view==='agents') root.innerHTML = renderAgents();
  else if(State.view==='teams') root.innerHTML = renderTeams();
  else if(State.view==='tasks') root.innerHTML = renderTasks();
  else if(State.view==='publish-task') root.innerHTML = renderPublishTask();
  else if(State.view==='providers') root.innerHTML = renderProviders();
  else if(State.view==='docs') root.innerHTML = renderDocs();
  root.classList.remove('view'); void root.offsetWidth; root.classList.add('view');
  wireViewEvents();
  updateNavCounts();
  document.getElementById('topbar-sub').textContent = TOPBAR_TEXT[State.view].sub();
}

function updateNavCounts(){
  document.getElementById('nav-count-agents').textContent = AGENTS.length;
  document.getElementById('nav-count-tasks').textContent = TASKS.filter(t=>t.status!=='done').length;
  const tv = document.getElementById('nav-count-teams');
  if(tv) tv.textContent = TEAMS.length;
  const pv = document.getElementById('nav-count-providers');
  if(pv) pv.textContent = PROVIDERS.length;
}

      </div>

      <div class="label">${s.label}</div>
    </div>`).join('');

  const timelineEvents = [

    const a = agentById(e.agentId);
    const openTask = taskById(e.taskId)?.status!=='open' ? ` data-open-task="${e.taskId}" style="cursor:pointer;"` : '';

function renderAgents(){
  const filters = [
    {key:'all', label:'全部'}, {key:'working', label:'工作中'}, {key:'idle', label:'空闲'}, {key:'offline', label:'离线'}
  ];
  const filterChips = filters.map(f=>`<button class="filter-chip ${State.agentFilter===f.key?'active':''}" data-agent-filter="${f.key}">${f.label}</button>`).join('');

  const list = AGENTS.filter(a=> State.agentFilter==='all' || a.status===State.agentFilter);
  const cards = list.map(a=>{
    const m = AGENT_STATUS_META[a.status];
    const skills = a.skills.slice(0,3).map(s=>`<span class="skill-chip">${esc(s)}</span>`).join('');
    const downweighted = a.recentRejects >= REJECT_DOWNWEIGHT_THRESHOLD;
    return `<div class="card agent-card" data-open-agent="${a.id}">
      <div class="head">
        ${avatarEl(a)}
        <div style="flex:1;min-width:0"><b>${a.name}</b><div class="role">${a.role}</div></div>
        <span class="pill ${m.pillClass}">${m.label}</span>
      </div>
      <div class="desc">${esc(a.bio)}</div>
      <div class="skills">${skills}</div>
      ${downweighted ? `<span class="trace-hint downweight" style="align-self:flex-start;">${ic('shield')}近期 ${a.recentRejects} 次被打回 · 匹配权重临时下调</span>` : ''}
      <div class="foot">
        <span class="metric">${ic('check')} 完成 ${a.stats.tasksDone}</span>
        <span class="metric">${ic('sparkle')} 评分 ${a.stats.avgScore}</span>
        <span class="metric">${ic('users')} 协作 ${a.stats.collabs}</span>
      </div>
    </div>`;
  }).join('');

  const createCard = `<div class="create-agent-card" id="create-agent-card">
      <div class="plus-circle">${ic('plus')}</div>
      <div><b style="font-size:13px;">创建新 Agent</b><br><span style="font-size:11.5px;">设定身份、技能与可挂载 Skill</span></div>
    </div>`;

  return `
    <div class="toolbar">${filterChips}</div>
    <div class="agent-grid">${createCard}${cards}</div>`;
}

/* ============================================================
   TEAMS —— 与自主认领并列的第二种组织方式
   团队 = 一组 Agent + 一个负责人（也是 Agent）。发布任务时可选团队模式；
   任务落到某团队后，只有该团队负责人能给步骤指派团队成员，全部完成后由
   负责人"汇总提交评审"——评审仍然走原有红线，不因为团队负责人而绕过。
============================================================ */
function renderTeams(){
  const createCard = `<div class="create-agent-card" id="create-team-card">
      <div class="plus-circle">${ic('plus')}</div>
      <div><b style="font-size:13px;">创建新团队</b><br><span style="font-size:11.5px;">选定负责人与成员</span></div>
    </div>`;
  const cards = TEAMS.map(t => {
    const owner = agentById(t.ownerAgentId);
    const members = t.memberAgentIds.map(id => agentById(id)).filter(Boolean);
    const ownerBadge = owner ? `<div class="team-owner"><span class="lead-tag">${ic('users')}负责人</span>${avatarEl(owner)}<b>${esc(owner.name)}</b><span class="hint">${owner.role}</span></div>` : '';
    const memberChips = members.map(a => `<span class="team-member-chip" title="${esc(a.name)}">${avatarEl(a)}<span>${esc(a.name)}</span></span>`).join('');
    return `<div class="card agent-card" data-open-team="${t.id}">
      <div class="head">
        <div class="avatar" style="background:var(--purple-soft);color:var(--purple)">${ic('users')}</div>
        <div style="flex:1;min-width:0"><b>${esc(t.name)}</b><div class="role">${esc(t.desc)}</div></div>
        <span class="pill st-planning">${members.length} 人</span>
      </div>
      ${ownerBadge}
      <div class="team-members">${memberChips}</div>
    </div>`;
  }).join('');
  return `<div class="agent-grid">${createCard}${cards}</div>`;
}

      </div>
      <div class="field">
        <label class="field-label">团队成员</label>
        <div class="card" style="padding:4px 14px;">${memberChecks}</div>
      </div>
    </div>
    <div class="modal-foot">
      ${draftTeam.mode!=='create'? '<button class="btn btn-ghost" id="btn-delete-team" style="color:var(--danger);margin-right:auto">'+ic('trash')+'删除团队</button>' : ''}
      <button class="btn btn-secondary" data-close-modal>取消</button>
      <button class="btn btn-primary" id="btn-save-team">${ic('check')}${draftTeam.mode==='create'?'创建团队':'保存修改'}</button>
    </div>`, 'wide');
  wireTeamDrawer();
}
function wireTeamDrawer(){
  const modal = document.getElementById('modal-container');
  modal.addEventListener('change', (e) => {
    if(e.target.id === 'tm-owner') draftTeam.ownerAgentId = e.target.value || null;
    const memberCk = e.target.closest('[data-team-member]');
    if(memberCk){
      const id = memberCk.dataset.teamMember;
      if(memberCk.checked){ if(!draftTeam.memberAgentIds.includes(id)) draftTeam.memberAgentIds.push(id); }
      else { draftTeam.memberAgentIds = draftTeam.memberAgentIds.filter(x => x !== id); }
    }
  });
  modal.addEventListener('input', (e) => {
    if(e.target.id === 'tm-name') draftTeam.name = e.target.value;
    if(e.target.id === 'tm-desc') draftTeam.desc = e.target.value;
  });
  modal.addEventListener('click', (e) => {
    if(e.target.closest('#btn-save-team')){
      const name = (draftTeam.name||'').trim();
      if(!name){ document.getElementById('tm-name').focus(); showToast('shield', '请先填写团队名称'); return; }
      if(!draftTeam.ownerAgentId){ showToast('shield', '请选择团队负责人'); return; }
      // 负责人必须在成员里
      if(!draftTeam.memberAgentIds.includes(draftTeam.ownerAgentId)){
        draftTeam.memberAgentIds.unshift(draftTeam.ownerAgentId);
      }
      const clean = { id:draftTeam.id, name, desc:draftTeam.desc||'', ownerAgentId:draftTeam.ownerAgentId, memberAgentIds:draftTeam.memberAgentIds };
      const idx = TEAMS.findIndex(t => t.id === clean.id);
      if(idx > -1){ TEAMS[idx] = clean; showToast('check', clean.name+' 已更新'); }
      else { TEAMS.push(clean); showToast('sparkle', clean.name+' 已创建'); }
      closeModal();
      if(State.view==='teams') renderView(); else updateNavCounts();
      return;
    }
    if(e.target.closest('#btn-delete-team')){
      const usedByTasks = TASKS.filter(t => t.teamId === draftTeam.id && t.status !== 'done').length;
      if(usedByTasks > 0){ showToast('shield', '还有 '+usedByTasks+' 个进行中的任务在使用此团队，请先完成或改派'); return; }
      TEAMS = TEAMS.filter(t => t.id !== draftTeam.id);
      showToast('trash', draftTeam.name+' 已删除');
      closeModal();
      if(State.view==='teams') renderView(); else updateNavCounts();
      return;
    }
  });
}

async function pairGateway(){
  const base = document.getElementById('gw-base').value.trim();
  const token = document.getElementById('gw-token').value.trim();
  if(!base || !token){ showToast('shield', '请填写 Base URL 与 Token'); return; }
  localGateway.baseUrl = base; localGateway.token = token;
  localGateway.connecting = true; localGateway.error = null; refreshLocalPanel();
  try{
    const health = await gwFetch('/health');
    localGateway.platform = health.data.platform;
    await scanGateway({ initial:true });
    localGateway.paired = true;
    try{ localStorage.setItem('buling-gateway', JSON.stringify({ baseUrl:base, token })); }catch(e){}
    showToast('check', '已连接本地网关（'+localGateway.platform+'）· 扫描到 '+localGateway.items.filter(i=>i.status==='installed').length+' 个 AI CLI');
  } catch(e){
    localGateway.error = String(e && e.message || e);
    showToast('trash', '连接失败：'+localGateway.error);
  } finally{
    localGateway.connecting = false; refreshLocalPanel();
  }
}
async function scanGateway(opts){
  localGateway.scanning = true; localGateway.error = null;
  if(!opts || !opts.initial) refreshLocalPanel();
  try{
    const r = await gwFetch('/discover');
    localGateway.items = r.data.items;
    localGateway.scannedAt = r.data.scannedAt;
    localGateway.platform = r.data.platform;
  } catch(e){
    localGateway.error = String(e && e.message || e);
    if(!opts || !opts.initial) showToast('trash', '扫描失败：'+localGateway.error);
    throw e;
  } finally{
    localGateway.scanning = false;
    if(!opts || !opts.initial) refreshLocalPanel();
  }
}
function unpairGateway(){
  localGateway = { ...localGateway, paired:false, items:[], scannedAt:null, error:null };
  try{ localStorage.removeItem('buling-gateway'); }catch(e){}
  refreshLocalPanel();
}
async function gwFetch(path){
  const res = await fetch(localGateway.baseUrl.replace(/\/+$/, '') + path, {
    headers: { 'X-Gateway-Token': localGateway.token, 'accept':'application/json' },
  });
  if(!res.ok) throw new Error('HTTP '+res.status+' '+res.statusText);
  return res.json();
}

/* 只重绘 modal 内容，不重新调用 wireAgentWizardEvents——所有交互监听器绑定在
   modal-container 这个不会被替换的外层节点上（事件委托），换步骤只是换 innerHTML，
   监听器天然还在，避免"每次换步骤都多绑一层"导致点击触发多次的问题。 */
function refreshWizard(){
  const modal = document.getElementById('modal-container');
  modal.innerHTML = agentWizardHtml(draftAgent);
  makeKeyboardClickable(modal);
}
function wireAgentWizardEvents(){
  const modalRoot = document.getElementById('modal-container');
  function refreshSkillPanel(){
    const body = document.getElementById('skill-panel-body');
    if(body) body.innerHTML = renderSkillPanelBody(draftAgent);
    modalRoot.querySelectorAll('.skill-tab').forEach(t=>t.classList.toggle('active', t.dataset.skillTab===skillPanelTab));
    makeKeyboardClickable(modalRoot);
  }
  function addSkill(val){
    val = val.trim(); if(!val || draftAgent.skills.includes(val)) return;
    draftAgent.skills.push(val);
    const box = document.getElementById('skill-tag-input');
    const input = document.getElementById('skill-input-field');
    const chip = document.createElement('span'); chip.className='chip'; chip.dataset.skill=val;
    chip.innerHTML = esc(val)+'<button data-remove-skill="'+esc(val)+'">'+ic('close')+'</button>';
    box.insertBefore(chip, input);
  }

  modalRoot.addEventListener('input', (e)=>{
    if(e.target.id==='f-name') draftAgent.name = e.target.value;
    else if(e.target.id==='f-role') draftAgent.role = e.target.value;
    else if(e.target.id==='f-bio') draftAgent.bio = e.target.value;
    else if(e.target.id==='f-budget') draftAgent.permissions.budget = e.target.value.trim() || null;
  });
  modalRoot.addEventListener('change', (e)=>{
    if(e.target.id==='perm-confirm-code'){ draftAgent.permissions.confirmCode = e.target.checked; return; }
    if(e.target.id==='perm-confirm-external'){ draftAgent.permissions.confirmExternal = e.target.checked; return; }
    const toggle = e.target.closest('[data-module-toggle]');
    if(toggle){
      const key = toggle.dataset.moduleToggle;
      if(toggle.checked){ if(!draftAgent.modules.includes(key)) draftAgent.modules.push(key); }
      else { draftAgent.modules = draftAgent.modules.filter(m=>m!==key); }
      return;
    }
    // 本机发现：真实网关返回的 CLI 条目——把 payload 并入统一目录，再挂/取消挂载
    const localToggle = e.target.closest('[data-local-toggle]');
    if(localToggle){
      const key = localToggle.dataset.localToggle;
      if(!MODULE_CATALOG[key]){
        try{
          const payload = JSON.parse(localToggle.dataset.localPayload || '{}');
          MODULE_CATALOG[key] = { name: payload.name || key, icon:'plug', desc: payload.desc || '', origin:'local', permission: payload.permission || '仅通过本地网关只读发现；执行仍需 Agent 权限位放行' };
        }catch(err){ /* payload 缺失也不阻塞挂载 */ }
      }
      if(localToggle.checked){ if(!draftAgent.modules.includes(key)) draftAgent.modules.push(key); }
      else { draftAgent.modules = draftAgent.modules.filter(m=>m!==key); }
    }
  });

  modalRoot.addEventListener('click', (e)=>{
    if(e.target.closest('[data-close-modal]')){ closeModal(); return; }

    const emoji = e.target.closest('[data-emoji]');
    if(emoji){ draftAgent.avatar = emoji.dataset.emoji; modalRoot.querySelectorAll('[data-emoji]').forEach(o=>o.classList.toggle('selected', o===emoji)); return; }
    const modelOpt = e.target.closest('[data-model]');
    if(modelOpt){ draftAgent.model = modelOpt.dataset.model; modalRoot.querySelectorAll('[data-model]').forEach(o=>o.classList.toggle('selected', o===modelOpt)); return; }
    if(e.target.closest('[data-goto-providers]')){ closeModal(); switchView('providers'); return; }
    const effortOpt = e.target.closest('[data-effort]');
    if(effortOpt){ draftAgent.effort = effortOpt.dataset.effort; modalRoot.querySelectorAll('[data-effort]').forEach(o=>o.classList.toggle('selected', o===effortOpt)); return; }
    const prefOpt = e.target.closest('[data-collab-pref]');
    if(prefOpt){ draftAgent.collabPref = prefOpt.dataset.collabPref; modalRoot.querySelectorAll('[data-collab-pref]').forEach(o=>o.classList.toggle('selected', o===prefOpt)); return; }

    const tab = e.target.closest('[data-skill-tab]');
    if(tab){ skillPanelTab = tab.dataset.skillTab; marketAddMode = null; refreshSkillPanel(); return; }
    if(e.target.closest('#btn-gw-pair')){ pairGateway(); return; }
    if(e.target.closest('#btn-gw-unpair')){ unpairGateway(); return; }
    if(e.target.closest('#btn-gw-scan')){ scanGateway(); return; }
    const installBtn = e.target.closest('[data-market-install]');
    if(installBtn){
      const id = installBtn.dataset.marketInstall;
      const idx = MARKET_CATALOG.findIndex(m=>m.id===id);
      if(idx>-1){
        const item = MARKET_CATALOG.splice(idx,1)[0];
        MODULE_CATALOG[id] = { name:item.name, icon:item.icon, desc:item.desc, origin:'market', permission:item.permission };
        refreshSkillPanel();
        showToast('check', item.name+' 已安装，可在"已安装"列表中启用');
      }
      return;
    }
    const delModBtn = e.target.closest('[data-module-delete]');
    if(delModBtn){
      const key = delModBtn.dataset.moduleDelete;
      const mod = MODULE_CATALOG[key];
      delete MODULE_CATALOG[key];
      AGENTS.forEach(a=>{ a.modules = a.modules.filter(m=>m!==key); });
      draftAgent.modules = draftAgent.modules.filter(m=>m!==key);
      refreshSkillPanel();
      showToast('trash', (mod?.name||'该模块')+' 已删除，所有 Agent 上的挂载一并移除');
      return;
    }
    const toggleUpload = e.target.closest('#btn-toggle-upload');
    if(toggleUpload){ marketAddMode = marketAddMode==='upload' ? null : 'upload'; refreshSkillPanel(); return; }
    const confirmUpload = e.target.closest('#btn-confirm-upload');
    if(confirmUpload){
      const nameInput = document.getElementById('upload-name');
      const name = nameInput.value.trim();
      if(!name){ nameInput.focus(); return; }
      const permission = document.getElementById('upload-permission').value.trim() || '未声明权限范围，安装后请核实';
      const desc = document.getElementById('upload-desc').value.trim() || '用户上传的技能包';
      const id = 'upload-'+Date.now();
      MODULE_CATALOG[id] = { name, icon:'puzzle', desc, origin:'market', permission, publisher:'我上传的 · 未验证' };
      marketAddMode = null;
      refreshSkillPanel();
      showToast('sparkle', name+' 已上传并安装，可在"已安装"列表中启用');
      return;
    }
    const linkBtn = e.target.closest('#btn-install-link');
    if(linkBtn){
      const input = document.getElementById('market-link-input');
      const url = input.value.trim();
      if(!url){ input.focus(); return; }
      let host = url;
      try{ host = new URL(url).hostname; }catch(err){}
      const id = 'link-'+Date.now();
      MODULE_CATALOG[id] = { name:host+' 技能包', icon:'web', desc:'通过链接安装：'+url, origin:'market', permission:'未声明权限范围，安装后请核实', publisher:'外部链接 · 未验证' };
      refreshSkillPanel();
      showToast('sparkle', '已按链接安装，可在"已安装"列表中启用');
      return;
    }

    const removeSkill = e.target.closest('[data-remove-skill]');
    if(removeSkill){
      const val = removeSkill.dataset.removeSkill;
      draftAgent.skills = draftAgent.skills.filter(s=>s!==val);
      removeSkill.closest('.chip').remove();
      return;
    }

    const nextBtn = e.target.closest('#btn-wizard-next');
    if(nextBtn){
      if(draftAgent.wizardStep===0 && !draftAgent.name.trim()){
        const input = document.getElementById('f-name');
        input.style.borderColor = 'var(--danger)';
        input.focus();
        showToast('shield', '请先填写 Agent 名称');
        return;
      }
      draftAgent.wizardStep++;
      refreshWizard();
      return;
    }
    const prevBtn = e.target.closest('#btn-wizard-prev');
    if(prevBtn){ draftAgent.wizardStep--; refreshWizard(); return; }
    const jump = e.target.closest('[data-wizard-jump]');
    if(jump){
      const idx = Number(jump.dataset.wizardJump);
      if(idx>0 && !draftAgent.name.trim()){ showToast('shield', '请先完成"身份"这一步'); return; }
      draftAgent.wizardStep = idx;
      refreshWizard();
      return;
    }

    const saveBtn = e.target.closest('#btn-save-agent');
    if(saveBtn){
      draftAgent.name = draftAgent.name.trim() || '未命名 Agent';
      draftAgent.role = draftAgent.role.trim() || '通用助理';
      delete draftAgent.wizardStep;
      if(draftAgent.mode==='create'){
        draftAgent.id = 'agent-'+Date.now();
        delete draftAgent.mode;
        AGENTS.push(draftAgent);

        const idx = AGENTS.findIndex(a=>a.id===draftAgent.id);

      return;

    const delBtn = e.target.closest('#btn-delete-agent');
    if(delBtn){
      AGENTS = AGENTS.filter(a=>a.id!==draftAgent.id);
      showToast('trash', draftAgent.name+' 已从 Agent 中心移除');
      closeModal();
      if(State.view==='agents') renderView(); else updateNavCounts();
      return;
    }
  });

  modalRoot.addEventListener('keydown', (e)=>{
