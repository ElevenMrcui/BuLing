/* 任务看板：只负责发现与认领，是独立的一个 tab，不掺杂任务详情。 */
function renderTasks(){
  const columns = ['open','planning','progress','review','done'];
  const colHtml = columns.map(colKey=>{
    const meta = STATUS_META[colKey];
    const items = TASKS.filter(t=>t.status===colKey);
    // 待认领列按"人工置顶优先，其余按未认领时长降序"排——紧急度可以自动累积，但人工置顶永远优先于算法排序
    if(colKey==='open') items.sort((a,b)=> (b.pinned - a.pinned) || ((b.openHours||0)-(a.openHours||0)));
    const cards = items.map(t=>taskCardHtml(t)).join('') || `<div class="empty-state" style="padding:24px 10px;"><span>暂无任务</span></div>`;
    return `<div class="board-col">
      <div class="board-col-head"><div class="dot" style="background:var(${meta.dotVar})"></div><b>${meta.label}</b><span class="n">${items.length}</span></div>
      <div class="board-col-body">${cards}</div>
    </div>`;
  }).join('');
  return `
    <div class="section-head" style="margin-top:0;"><h2>任务看板</h2><button class="btn btn-primary btn-sm" data-action="new-task">${ic('plus')}发布任务</button></div>
    <div class="board">${colHtml}</div>`;
}

/* 任务不认"某个具体 Agent"，只认"谁满足技能契约"——任何命中契约的 Agent 都可以互相替代
   （里氏替换）。匹配结果永远是现算的候选名单，不是写死在任务数据里的单一答案。 */
function computeMatchCandidates(task){
  const required = task.requiredSkills || [];
  if(!required.length) return [];
  const scored = AGENTS.map(a=>{
    const matched = required.filter(rs => a.skills.some(s=> s.includes(rs) || rs.includes(s)));
    const baseScore = Math.round(matched.length/required.length*100);
    // 协作痕迹机制：近期真的做过这类任务就 boost，很久没碰就 decay，权重不是永远焊死在静态技能标签上
    const traceDelta = a.trace ? a.trace.delta : 0;
    // 容错的隔离降权：多次被打回会临时拉低匹配权重，产出回升后会自然恢复（见 recentRejects 的增减逻辑）
    const downweighted = a.recentRejects >= REJECT_DOWNWEIGHT_THRESHOLD;
    const rejectDelta = downweighted ? -8 : 0;
    const score = Math.max(0, Math.min(99, baseScore + traceDelta + rejectDelta));
    return { agent:a, matched, score, baseScore, trace:a.trace, downweighted };
  }).filter(c=> c.baseScore>0 && c.agent.status!=='offline');
  scored.sort((a,b)=> b.score-a.score || (b.agent.status==='working'?-1:1));
  return scored.slice(0,3);
}
/* 自主认领机制的累积式紧急度：未认领时长持续累积成强度，而不是发布时手动写死的高/中/低标签；
   一旦被响应（认领），强度立刻归零衰减。但强度只影响"看起来多显眼"，最终排序仍留一个
   人工强制置顶的入口——算法不能替人做"这单必须先做"的决定。 */
function urgencyMeta(t){
  const h = t.openHours || 0;
  const pct = Math.max(6, Math.min(100, Math.round(h/48*100)));
  let tier, colorVar;
  if(h>=24){ tier='高'; colorVar='--danger'; }
  else if(h>=8){ tier='中'; colorVar='--warning'; }
  else { tier='低'; colorVar='--ink-tertiary'; }
  return { pct, tier, colorVar, hours:h };
}
function traceHintHtml(c){
  const bits = [];
  if(c.trace) bits.push(`<span class="trace-hint ${c.trace.delta>0?'boost':'decay'}">${c.trace.delta>0?ic('sparkle'):ic('clock')}${esc(c.trace.label)}</span>`);
  if(c.downweighted) bits.push(`<span class="trace-hint downweight">${ic('shield')}临时降权中</span>`);
  return bits.join('');
}
function renderMatchCandidateRow(task, c, isTop){
  // 单技能任务不用再摆一排契约 chip——旁边任务卡上早就写了需要什么技能，重复摆一遍是噪音；
  // 只有多技能任务才需要看清"这个候选人具体覆盖了哪几项"。
  const contractLine = task.requiredSkills.length>1
    ? `<div class="contract-chips">${task.requiredSkills.map(rs=>{
        const hit = c.matched.includes(rs);
        return `<span class="contract-chip ${hit?'hit':''}">${hit?ic('check'):''}${esc(rs)}</span>`;
      }).join('')}</div>`
    : `<div class="hint" style="margin:0;">契约命中 ${c.matched.length}/${task.requiredSkills.length} 项</div>`;
  return `<div class="match-candidate-row">
    <div class="who">${avatarEl(c.agent)}<div><b>${c.agent.name}</b><span>${c.agent.role}</span></div>
      ${isTop? '<span class="pill st-open" style="margin-left:auto">推荐</span>':''}
    </div>
    <div class="intent-bar${isTop?' animate':''}"><div class="fill" style="width:${c.score}%"></div></div>
    <div class="intent-row"><span>认领意愿</span><b>${c.score}%</b></div>
    ${traceHintHtml(c) ? `<div style="display:flex;flex-wrap:wrap;gap:5px;">${traceHintHtml(c)}</div>` : ''}
    ${contractLine}
    <button class="btn btn-ghost btn-sm" data-claim="${task.id}" data-claim-agent="${c.agent.id}" style="align-self:flex-end;">由此 Agent 领取</button>
  </div>`;
}
function taskCardHtml(t){
  const pMeta = PRIORITY_META[t.priority];
  const tags = t.requiredSkills.map(s=>`<span class="skill-chip">${esc(s)}</span>`).join('');
  const assignees = t.assignees.map(id=>avatarEl(agentById(id))).join('');
  let matchBlock = '';
  let urgencyRail = '';
  if(t.status==='open'){
    const um = urgencyMeta(t);
    urgencyRail = `<div class="urgency-rail"><div class="fill" style="width:${um.pct}%;background:var(${um.colorVar})"></div></div>
      <div class="urgency-row">${ic('clock')}未认领 ${um.hours} 小时 · 紧急度${um.tier}
        ${t.pinned? '<span class="pinned-tag">'+ic('sparkle')+'人工置顶</span>' : `<button type="button" class="pin-btn" data-pin="${t.id}">${ic('sparkle')}人工置顶</button>`}
      </div>`;
    const candidates = computeMatchCandidates(t);
    if(!candidates.length){
      matchBlock = `<div class="empty-state" style="padding:10px 6px;"><span>暂无 Agent 满足技能契约</span></div>`;
    } else {
      const top = candidates[0];
      const needsPack = t.requiredSkills.length > 1;
      const interested = AGENTS.filter(a=> a.status!=='offline' && t.requiredSkills.some(rs=> a.skills.some(s=> s.includes(rs) || rs.includes(s)))).length;
      const swarmNote = needsPack
        ? `<div class="swarm-note">${ic('users')}需要 <b>${t.requiredSkills.length}</b> 项技能协同 · <b>${interested}</b> 位 Agent 具备相关技能</div>`
        : '';
      matchBlock = `
        ${swarmNote}
        <button type="button" class="match-banner intent-fill" data-toggle-match="${t.id}" style="--intent:${top.score}%;">
          ${ic('sparkle')} ${top.agent.name} 认领意愿 ${top.score}%
          <span class="match-expand-icon">${ic('chevronDown')}</span>
        </button>
        <div class="match-detail" id="match-detail-${t.id}" hidden>
          ${candidates.map((c,i)=>renderMatchCandidateRow(t,c,i===0)).join('')}
        </div>
        <button class="btn btn-primary btn-sm claim-btn" data-claim="${t.id}" data-claim-agent="${top.agent.id}">${ic('flow')}${needsPack?'自动组队认领':'自动匹配领取'}</button>`;
    }
  } else {
    matchBlock = `<div class="foot"><div class="assignees">${assignees}</div><div class="due">${ic('clock')} ${t.due}</div></div>`;
  }
  // 未认领任务用紧急度条替代静态优先级标签（讨论结论：连续累积值取代人工写死的高/中/低）；
  // 一旦认领进入执行，紧急度不再有意义，改回展示静态优先级
  const priorityBadge = t.status==='open' ? '' : `<span class="pill ${pMeta.pillClass}" style="flex-shrink:0">${pMeta.label}</span>`;
  const teamBadge = t.assignMode==='team' && t.teamId
    ? `<span class="team-mode-tag" style="margin-left:0;">${ic('users')}团队 · ${esc(teamById(t.teamId)?.name || '')}</span>`
    : '';
  return `<div class="card task-card" data-open-task="${t.id}">
    ${urgencyRail}
    <div style="display:flex;gap:8px;align-items:flex-start;justify-content:space-between;">
      <div class="title">${esc(t.title)}</div>
      ${priorityBadge}
    </div>
    <div class="tags">${tags}${teamBadge}</div>
    ${matchBlock}
  </div>`;
}

function claimTask(taskId, agentId, btn){
  btn.disabled = true;
  btn.textContent = '正在核对技能契约…';
  btn.classList.add('claim-pulse');
  setTimeout(()=>{
    const t = taskById(taskId);
    const agent = agentById(agentId);
    const candidate = computeMatchCandidates(t).find(c=>c.agent.id===agentId);
    const scoreLabel = candidate ? candidate.score : '--';
    t.status = 'planning';
    t.assignees = [agentId];
    t.progressPct = 5;
    t.plan = [
      { title:'任务需求拆解', status:'active', agentId },
      { title:'资料收集与执行', status:'pending', agentId },
      { title:'产出与自查', status:'pending', agentId:null },
    ];
    t.logs = [{ type:'system', text:agent.name+' 以 '+scoreLabel+'% 契约命中度自主领取该任务', time:'刚刚' }];
    showToast('sparkle', agent.name+' 已自主领取「'+t.title+'」');
    renderView();
  }, 900);
}

/* ---- 共享渲染片段：三种角色视图都会用到，避免重复逻辑 ---- */
/* 挑一个"外援"加入临时攻坚小组：不找已经在这个任务里的人，优先选战绩更好的空闲/在线 Agent——
   这不是永久调岗，只是围绕当前瓶颈临时聚一次，瓶颈解除后这份组队关系就不再存在。 */
function pickSquadHelper(task, excludeId){
  const candidates = AGENTS.filter(a=> a.id!==excludeId && a.status!=='offline' && !task.assignees.includes(a.id));
  candidates.sort((a,b)=> b.stats.collabs - a.stats.collabs);
  return candidates[0] || AGENTS.find(a=>a.id!==excludeId);
}
function renderPlanHtml(task){
  const steps = task.plan;
  return steps.map(s=>{
    const idx = steps.indexOf(s);
    if(s.light){
      return `<div class="plan-step ${s.status}">
        <div class="check">${s.status==='done'?ic('check'):'<span style="font-size:10px;font-weight:700">'+(idx+1)+'</span>'}</div>
        <div class="body">
          <div class="title">${esc(s.title)}</div>
          <div class="light-unit"><div class="mark">${ic('puzzle')}</div>轻量执行单元 · 无固定身份，用完即释放</div>
          ${s.status==='active'? `<button class="btn btn-primary btn-sm" data-complete-step="${task.id}|${idx}" style="margin-top:8px;">${ic('check')}标记为完成</button>` : ''}
        </div>
      </div>`;
    }
    const agent = s.agentId ? agentById(s.agentId) : null;
    const squadAgents = (s.squad||[]).map(id=>agentById(id)).filter(Boolean);
    const stepKey = task.id+'|'+idx;
    let actions = '';
    if(s.status==='active' && agent){
      actions = `<button type="button" class="btn btn-primary btn-sm" data-complete-step="${task.id}|${idx}" style="margin-top:8px;">${ic('check')}标记为完成</button>
      <div class="plan-actions">
        <button type="button" class="btn btn-ghost btn-sm" data-handoff-step="${stepKey}">${ic('users')}换人接棒</button>
        ${s.blocked
          ? `<button type="button" class="btn btn-ghost btn-sm" data-dissolve-squad="${stepKey}">${ic('close')}解除攻坚小组</button>`
          : `<button type="button" class="btn btn-ghost btn-sm" data-mark-bottleneck="${stepKey}">${ic('sparkle')}标记为卡点</button>`}
      </div>
      <div class="handoff-menu" id="handoff-menu-${stepKey.replace('|','-')}" hidden>
        ${AGENTS.filter(a=>a.id!==s.agentId && a.status!=='offline').map(a=>`<button type="button" class="handoff-opt" data-handoff-to="${stepKey}|${a.id}">${avatarEl(a)}${a.name} · ${a.role}</button>`).join('')}
      </div>`;
    }
    const squadBadge = s.blocked && squadAgents.length>1
      ? `<div class="squad-badge"><div class="who">${squadAgents.map(a=>avatarEl(a)).join('')}</div><div class="text">已围绕此卡点临时组队 · ${squadAgents.map(a=>a.name).join(' + ')}</div></div>`
      : '';
    // 团队模式下未指派 / 未激活的步骤：团队负责人可直接给团队成员指派
    let teamAssign = '';
    if(task.assignMode === 'team' && task.teamId && !agent && s.status !== 'done'){
      const team = teamById(task.teamId);
      if(team){
        const opts = team.memberAgentIds.map(id => {
          const a = agentById(id); if(!a) return '';
          return `<option value="${a.id}">${esc(a.name)} · ${esc(a.role)}</option>`;
        }).join('');
        teamAssign = `<div class="assign-inline">${ic('users')}<span class="hint" style="margin:0;">团队负责人指派：</span>
          <select data-team-assign="${task.id}|${idx}"><option value="">选择成员…</option>${opts}</select></div>`;
      }
    }
    return `<div class="plan-step ${s.status}">
      <div class="check">${s.status==='done'?ic('check'):'<span style="font-size:10px;font-weight:700">'+(idx+1)+'</span>'}</div>
      <div class="body">
        <div class="title">${esc(s.title)}</div>
        ${agent? `<div class="who">${avatarEl(agent)} ${agent.name} · ${agent.role}</div>` : `<div class="who">${ic('clock')} 待分配</div>`}
        ${teamAssign}
        ${squadBadge}
        ${actions}
      </div>
    </div>`;
  }).join('') || `<div class="empty-state" style="padding:20px;"><span>暂无规划步骤</span></div>`;
}
function renderLogHtml(logs){
  return logs.map(l=>{
    if(l.type==='system'){
      return `<div class="log-item system"><div class="bubble"><div class="text">${esc(l.text)} · ${l.time}</div></div></div>`;
    }
    const agent = agentById(l.agentId);
    const isTyping = l.type==='typing';
    return `<div class="log-item">
      ${avatarEl(agent)}
      <div class="bubble">
        <div class="who">${agent.name}<span class="role-tag">${agent.role}</span></div>
        ${isTyping? `<span class="typing-dots"><span></span><span></span><span></span></span>` : `<div class="text">${esc(l.text)}</div>`}
        ${l.doc? `<div class="doc-chip" data-open-doc="${l.doc}">${ic('doc')} ${esc(docById(l.doc).title)}</div>`:''}
        ${!isTyping? `<div class="time">${l.time}</div>` : ''}
      </div>
    </div>`;
  }).join('') || `<div class="empty-state" style="padding:30px;"><span>暂无协作记录</span></div>`;
}
/* 产出文档面板和"评审"操作合二为一：任务进入待评审状态时，未批准的文档直接在这里露出
   批准/打回按钮，不需要切一个"评审人视角"才能看到；已批准的文档换成一枚徽章。 */
function renderTaskDocsHtml(t){
  if(!t.docs.length) return `<div class="empty-state" style="padding:20px;"><span>暂无产出文档</span></div>`;
  return t.docs.map(id=>{
    const d = docById(id); const dm = DOC_TYPE_META[d.type];
    const approved = d.reviewStatus==='approved';
    const actionable = t.status==='review' && !approved;
    return `<div class="doc-preview-card" data-open-doc="${d.id}" style="align-items:flex-start;">
      <div class="thumb" style="background:${dm.bg};color:${dm.color}">${ic(dm.icon)}</div>
      <div class="info" style="flex:1;"><b>${esc(d.title)}</b><span>${agentById(d.agentId).name} · ${d.date}</span></div>
      ${approved ? `<span class="pill st-done" style="flex-shrink:0;">${ic('check')}已批准</span>` : ''}
      ${actionable ? `<div style="display:flex;gap:6px;flex-shrink:0;" onclick="event.stopPropagation()">
        <button class="btn btn-secondary btn-sm" data-reject-doc="${d.id}|${t.id}">打回</button>
        <button class="btn btn-primary btn-sm" data-approve-doc="${d.id}|${t.id}">批准</button>
      </div>` : ''}
    </div>`;
  }).join('');
}
function renderRosterHtml(assigneeIds){
  return assigneeIds.map(id=>{
    const a = agentById(id);
    return `<div class="roster-item" data-open-agent="${a.id}" style="cursor:pointer">
      ${avatarEl(a)}
      <div class="info"><b>${a.name}</b><span>${a.role}</span></div>
      <span class="pill ${AGENT_STATUS_META[a.status].pillClass}">${AGENT_STATUS_META[a.status].label}</span>
    </div>`;
  }).join('') || `<div class="empty-state" style="padding:14px;"><span>尚未分配 Agent</span></div>`;
}

/* 临时协同机制的临时领队：不是固定角色，而是当前推进节点落在谁身上，谁就临时统筹——
   步骤流转到下一个人，领队标记自动跟着转移，任务结束后这个标记也随之消失。 */
function currentLead(t){
  // 团队模式的领队恒定 = 团队负责人；其它模式沿用"当前 active 步骤对应人 = 临时领队"
  if(t.assignMode === 'team' && t.teamOwnerAgentId) return agentById(t.teamOwnerAgentId);
  const step = t.plan.find(s=>s.status==='active');
  return step && step.agentId ? agentById(step.agentId) : null;
}
/* 团队模式条：任务详情顶部展示团队 / 负责人 / 成员，明确"这是团队模式" */
function renderTeamModeBanner(t){
  if(t.assignMode !== 'team' || !t.teamId) return '';
  const team = teamById(t.teamId);
  if(!team) return '';
  const owner = agentById(t.teamOwnerAgentId || team.ownerAgentId);
  const memberChips = team.memberAgentIds.map(id => {
    const a = agentById(id); if(!a) return '';
    return `<span class="team-member-chip">${avatarEl(a)}<span>${esc(a.name)}</span></span>`;
  }).join('');
  return `<div class="team-mode-banner">
    ${ic('users')}
    <div style="flex:1;min-width:0;">
      <b>团队模式 · ${esc(team.name)}</b>
      <div class="hint" style="margin:2px 0 6px;">负责人 ${owner?esc(owner.name):'—'} 分配团队成员执行、汇总提交评审；评审仍走人工红线，不因此绕过。</div>
      <div class="team-members">${memberChips}</div>
    </div>
  </div>`;
}
/* 团队模式汇总入口：当所有步骤都完成，团队负责人可以"汇总并提交评审"（推入 review 状态）。 */
function renderTeamSummarize(t){
  if(t.assignMode !== 'team' || t.status !== 'progress') return '';
  const allDone = t.plan.length > 0 && t.plan.every(s => s.status === 'done');
  if(!allDone) return '';
  return `<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border);">
    <button class="btn btn-primary btn-sm" data-team-summarize="${t.id}">${ic('check')}汇总并提交评审</button>
    <div class="hint" style="display:inline;margin-left:8px;">全部步骤已完成，团队负责人操作把任务推入待评审。</div>
  </div>`;
}
/* 任务详情只有一份，不再区分"负责人/执行者/评审人"三套视角——规划、时间线、产出、
   评审操作、团队名单同屏展示，谁需要什么直接在这一屏里找，不用先决定"我现在扮演谁"。 */
function renderTaskDetail(t){
  const lead = currentLead(t);
  const pMeta = PRIORITY_META[t.priority], sMeta = STATUS_META[t.status];
  return `
    <button type="button" class="link-back" data-back-to-board>${ic('chevronRight')}返回工作台概览</button>
    <div class="detail-head">
      <div>
        <h2>${esc(t.title)}</h2>
        <div class="meta-row">
          <span class="pill ${sMeta.pillClass}">${sMeta.label}</span>
          <span class="pill ${pMeta.pillClass}">${pMeta.label}</span>
          <span style="font-size:12px;color:var(--ink-tertiary);display:inline-flex;align-items:center;gap:5px;">${ic('clock')} ${t.due}</span>
        </div>
      </div>
      <div class="progress-ring-wrap">
        <div><b>${t.progressPct}%</b><span>整体进度</span></div>
      </div>
    </div>
    <div style="font-size:13px;color:var(--ink-secondary);line-height:1.6;margin-bottom:20px;max-width:70ch;">${esc(t.desc)}</div>
    ${renderTeamModeBanner(t)}
    <div class="detail-grid">
      <div>
        <div class="card panel">
          <div class="panel-head"><h3>${ic('puzzle')}${t.assignMode==='team'?'任务规划（团队负责人指派）':'自动任务规划'}</h3>
            ${lead? `<span class="lead-tag">${ic('users')}${t.assignMode==='team'?'负责人':'临时领队'} · ${esc(lead.name)}</span>` : ''}
          </div>
          ${renderPlanHtml(t)}
          ${renderTeamSummarize(t)}
        </div>
        <div class="card panel">
          <div class="panel-head"><h3>${ic('flow')}协作时间线</h3></div>
          <div class="log-feed">${renderLogHtml(t.logs)}</div>
        </div>
      </div>
      <div>
        <div class="card panel">
          <div class="panel-head"><h3>${ic('doc')}产出文档${t.status==='review'?' · 待评审':''}</h3></div>
          <div style="display:flex;flex-direction:column;gap:10px;">${renderTaskDocsHtml(t)}</div>
        </div>
        <div class="card panel">
          <div class="panel-head"><h3>${ic('users')}协作团队</h3></div>
          <div class="team-roster">${renderRosterHtml(t.assignees)}</div>
        </div>
      </div>
    </div>`;
}

/* ============================================================
   DOCS LIBRARY
============================================================ */
/* 协作痕迹机制的引用强度：文档被多少条协作记录引用过，等同于这条"痕迹"被走过几次——
   引用越多，说明这份产出越被后来者依赖，不需要谁去特意宣布它的重要性。 */
function docCiteCount(docId){
  return TASKS.reduce((n,t)=> n + t.logs.filter(l=>l.doc===docId).length, 0);
}
function docCardHtml(d){
  const dm = DOC_TYPE_META[d.type];
  const agent = agentById(d.agentId);
  const task = d.taskId ? taskById(d.taskId) : null;
  const cites = docCiteCount(d.id);
  return `<div class="card doc-card" data-open-doc="${d.id}">
    <div class="top">
      <div class="filetype" style="background:${dm.bg};color:${dm.color}">${ic(dm.icon)}</div>
      <div><div class="title">${esc(d.title)}</div><div class="task-src">${task? '来自任务 · '+esc(task.title) : dm.label}</div></div>
    </div>
    <div class="foot">
      <div class="author">${avatarEl(agent)} ${agent.name}</div>
      ${cites>0? `<span class="trail-tag">${ic('layers')}被引用 ${cites} 次</span>` : `<div class="date">${d.date}</div>`}
    </div>
  </div>`;
}
/* 默认按项目（任务）分组浏览——文档的血缘是"任务的产出"，这才是用户脑子里的主索引；
   没有任务归属的独立产出单独归入"未归类"，不强行塞进项目树。 */
function renderDocsByProject(){
  const groups = TASKS.map(t=>({ task:t, docs: DOCS.filter(d=>d.taskId===t.id) })).filter(g=>g.docs.length);
  const orphan = DOCS.filter(d=>!d.taskId);
  let html = groups.map(g=>{
    const sMeta = STATUS_META[g.task.status];
    return `<div class="doc-project-group">
      <button type="button" class="doc-project-head" data-open-task-from-docs="${g.task.id}">
        <span class="pill ${sMeta.pillClass}">${sMeta.label}</span>
        <b>${esc(g.task.title)}</b>
        <span class="doc-project-count">${g.docs.length} 份文档 ${ic('chevronRight')}</span>
      </button>
      <div class="doc-grid">${g.docs.map(docCardHtml).join('')}</div>
    </div>`;
  }).join('');
  if(orphan.length){
    html += `<div class="doc-project-group">
      <div class="doc-project-head" style="cursor:default;">
        <span class="pill st-idle">未归类</span>
        <b>不属于任何任务的独立产出</b>
        <span class="doc-project-count">${orphan.length} 份文档</span>
      </div>
      <div class="doc-grid">${orphan.map(docCardHtml).join('')}</div>
    </div>`;
  }
  return html || `<div class="empty-state" style="padding:40px;"><span>暂无文档</span></div>`;
}
/* 跨项目的检索视图——按类型筛选，服务"这周所有产出""所有 PDF"这类横切查询，
   和上面的项目分组是同一份数据的两种视图，而不是两套系统。 */
function renderDocsFlat(){
  const types = [
    {key:'all', label:'全部'}, {key:'doc', label:'Word 文档'}, {key:'pdf', label:'PDF'},
    {key:'sheet', label:'表格'}, {key:'image', label:'视觉稿'},
  ];
  const chips = types.map(ty=>`<button class="filter-chip ${State.docsTypeFilter===ty.key?'active':''}" data-docs-type-filter="${ty.key}">${ty.label}</button>`).join('');
  const list = DOCS.filter(d=> State.docsTypeFilter==='all' || d.type===State.docsTypeFilter);
  const cards = list.map(docCardHtml).join('') || `<div class="empty-state" style="padding:40px;"><span>没有符合条件的文档</span></div>`;
  return `<div class="toolbar">${chips}</div><div class="doc-grid">${cards}</div>`;
}
function renderDocs(){
  const tabs = `<div class="role-tabs" style="margin-bottom:22px;">
    <button type="button" class="role-tab ${State.docsView==='byProject'?'active':''}" data-docs-view="byProject">按项目分组</button>
    <button type="button" class="role-tab ${State.docsView==='flat'?'active':''}" data-docs-view="flat">全部文档（可筛选）</button>
  </div>`;
  return tabs + (State.docsView==='flat' ? renderDocsFlat() : renderDocsByProject());
}

function docPreviewHtml(d){
  const dm = DOC_TYPE_META[d.type];
  const agent = agentById(d.agentId);
  const task = d.taskId ? taskById(d.taskId) : null;
  return `
    <div class="modal-head"><h3>文档预览</h3><button class="btn-icon" data-close-modal>${ic('close')}</button></div>
    <div class="modal-body">
      <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:18px;">
        <div class="filetype" style="width:52px;height:64px;background:${dm.bg};color:${dm.color}">${ic(dm.icon)}</div>
        <div>
          <b style="font-size:15px;">${esc(d.title)}</b>
          <div style="font-size:12px;color:var(--ink-tertiary);margin-top:4px;">由 ${agent.name} · ${agent.role} 产出 · ${d.date}</div>

let newTaskSkills = [];
function wirePublishTaskEvents(){
  document.querySelectorAll('[data-priority]').forEach(el=>el.addEventListener('click', ()=>{
    document.querySelectorAll('[data-priority]').forEach(o=>o.classList.toggle('selected', o===el));
  }));
  document.querySelectorAll('[data-assign]').forEach(el=>el.addEventListener('click', ()=>{
    document.querySelectorAll('[data-assign]').forEach(o=>o.classList.toggle('selected', o===el));
    const teamFields = document.getElementById('nt-team-fields');
    if(teamFields) teamFields.style.display = el.dataset.assign === 'team' ? '' : 'none';
  }));
  const teamSelect = document.getElementById('nt-team');
  const ownerSelect = document.getElementById('nt-team-owner');
  if(teamSelect && ownerSelect){
    teamSelect.addEventListener('change', () => {
      const team = teamById(teamSelect.value);
      ownerSelect.innerHTML = '<option value="">— 团队负责人 —</option>' +
        (team ? team.memberAgentIds.map(id => {
          const a = agentById(id); if(!a) return '';
          const sel = id === team.ownerAgentId ? ' selected' : '';
          return `<option value="${a.id}"${sel}>${esc(a.name)} · ${esc(a.role)}</option>`;
        }).join('') : '');
      ownerSelect.disabled = !team;
    });
  }
  const field = document.getElementById('nt-skill-field');
  if(field) field.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===','){
      e.preventDefault();
      const val = field.value.trim();
      if(val && !newTaskSkills.includes(val)){
        newTaskSkills.push(val);
        const chip = document.createElement('span'); chip.className='chip tone-purple';
        chip.innerHTML = esc(val)+'<button>'+ic('close')+'</button>';
        chip.querySelector('button').addEventListener('click', ()=>{ newTaskSkills = newTaskSkills.filter(s=>s!==val); chip.remove(); });
        document.getElementById('nt-tag-input').insertBefore(chip, field);
      }
      field.value='';
    }
  });
  const publishBtn = document.getElementById('btn-publish-task');
  if(publishBtn) publishBtn.addEventListener('click', ()=>{
    const title = document.getElementById('nt-title').value.trim();
    if(!title){ document.getElementById('nt-title').focus(); return; }
    const priority = document.querySelector('[data-priority].selected')?.dataset.priority || 'mid';
    const assignMode = document.querySelector('[data-assign].selected')?.dataset.assign || 'auto';
    const due = document.getElementById('nt-due').value.trim() || '待定';
    const skills = newTaskSkills.length? newTaskSkills : ['通用协作'];
    let best = AGENTS[0], bestScore = -1;
    AGENTS.forEach(a=>{
      const overlap = a.skills.filter(s=> skills.some(rs=> s.includes(rs) || rs.includes(s))).length;
      if(overlap > bestScore){ bestScore = overlap; best = a; }
    });
    const score = Math.min(98, 78 + bestScore*7 + Math.floor(Math.random()*6));
    // 团队模式：读取团队 + 负责人；plan 里的步骤先按标准三步生成，agentId 留空由负责人指派
    let teamId = null, teamOwnerAgentId = null, teamOwner = null, team = null;
    if(assignMode === 'team'){
      teamId = document.getElementById('nt-team').value;
      teamOwnerAgentId = document.getElementById('nt-team-owner').value;
      team = teamId ? teamById(teamId) : null;
      if(!team){ showToast('shield', '请先选择团队'); return; }
      if(!teamOwnerAgentId){ showToast('shield', '请选择团队负责人'); return; }
      teamOwner = agentById(teamOwnerAgentId);
    }
    const task = {
      id:'t-'+Date.now(), title,
      status: assignMode==='auto' ? 'open' : 'planning',
      priority,
      desc: document.getElementById('nt-desc').value.trim() || '暂无详细描述。',
      requiredSkills: skills, due: due+'截止',
      assignees: assignMode==='auto' ? []
               : assignMode==='team' ? [teamOwnerAgentId]
               : [best.id],
      progressPct: 0, matchAgentId: best.id, matchScore: score,
      assignMode, teamId, teamOwnerAgentId,
      plan:
        assignMode==='manual' ? [{title:'任务需求拆解', status:'active', agentId:best.id}] :
        assignMode==='team' ? [
          { title:'需求拆解与关键信息收集', status:'active', agentId:teamOwnerAgentId },
          { title:'团队成员分工执行', status:'pending', agentId:null },
          { title:'汇总与联合评审前自查', status:'pending', agentId:teamOwnerAgentId },
        ] : [],
      logs:
        assignMode==='manual' ? [{type:'system', text:'任务已直接分配给 '+best.name, time:'刚刚'}] :
        assignMode==='team' ? [{type:'system', text:'任务已交给团队「'+team.name+'」·负责人 '+teamOwner.name+'——由负责人分配团队成员执行', time:'刚刚'}] :
        [],
      docs:[], openHours:0, pinned:false
    };
    TASKS.unshift(task);
    const toastMsg =
      assignMode==='auto' ? '，等待 Agent 自主领取' :
      assignMode==='team' ? '，已交给团队「'+team.name+'」·负责人 '+teamOwner.name :
      '，已分配给 '+best.name;
    showToast('sparkle', '任务「'+title+'」已发布'+toastMsg);
    newTaskSkills = [];
    switchView('tasks');
  });
}

/* ============================================================
   MECHANISM MODAL — 按场景拆解的协作机制矩阵
   （产品里只保留落地结论，统一用功能名：自主认领机制 / 临时协同机制 / 协作痕迹机制；
   设计取舍的完整来源见 docs/协作机制设计.md）
============================================================ */
const MECH_MATRIX = [
  { scene:'任务发现与认领', where:'任务看板',
    use:[['自主认领机制','多候选人"认领意愿"动态累积，替代一次性算出的静态匹配度'],['协作痕迹机制','匹配权重按历史完成痕迹自我强化 / 久未接触则自然衰减']],
    land:'把"契约匹配度 96%"改成动态意愿强度条，多个 Agent 同屏展示认领意愿；系统记录 Agent 在各类任务上的历史完成频率，权重随时间自然衰减。',
    avoid:[['论资排辈式的经验优先','任务看板面向开放候选池，套用会让新 Agent 永远抢不到任务，丧失去中心化竞争的意义']] },
  { scene:'紧急度 / 优先级呈现', where:'任务看板',
    use:[['自主认领机制','连续衰减 / 累积值，替代静态的"高 / 中 / 低"标签']],
    land:'未认领时间越长，任务卡片的紧急强度越高（视觉上逐渐变浓）；一旦被响应，强度随之衰减。',
    avoid:[['纯规则自动裁决','紧急度不能让算法完全说了算，必须保留人工一键强制插单 / 置顶的入口']] },
  { scene:'复杂任务的角色分配', where:'任务详情',
    use:[['临时协同机制','步骤支持实时接力补位，卡壳时可换人接手当前进度'],['协作痕迹机制','持续阻塞下游的瓶颈处，临时拉起协作小组集中攻克，解除后自动解散']],
    land:'给执行中的步骤加"换人接棒"操作；识别到某步骤持续阻塞下游多个子任务时，自动组建临时攻坚小组，问题解除后小组自动解散。',
    avoid:[['开放式竞争认领','执行阶段需要无缝交接和连续性，不该在中途重新引发多个 Agent 抢一个进行中步骤，会打乱协作节奏']] },
  { scene:'Agent 身份与信任模型', where:'Agent 中心',
    use:[['临时协同机制','核心协作角色的协调权靠战绩（完成数 / 评分 / 协作次数）积累，而非预设职位'],['协作痕迹机制','低风险机械子任务（格式转换、数据清洗、简单校验）可用无状态、用完即弃的"轻量执行单元"']],
    land:'协调权随 stats 变化可在核心角色间转移；给机械类子任务放开轻量匿名执行位，不强制走完整 Agent 建档流程。',
    avoid:[['个体可随意替换的假设','不能套在核心协作角色和审查类角色上，代码审查、安全评估必须保留固定身份与可追溯记录，不能做成随时替换的无名执行单元']] },
  { scene:'团队 / 组织规模扩展', where:'预留',
    use:[['临时协同机制','规模超过阈值后"分裂"出新工作区，而非无限塞人']],
    land:'某类项目积累到一定量后，允许把相关 Agent 拆分成独立子工作区（当前规模尚小，先记录方向，暂不做成界面功能）。',
    avoid:[['大规模匿名冗余容错','当前是个位数 Agent 的小规模场景，硬套大规模统计冗余逻辑没有意义']] },
  { scene:'通讯与状态广播', where:'全局',
    use:[['临时协同机制','远距离粗信号（在线状态点）+ 近距离细信号（详细日志）分层'],['协作痕迹机制','活动日志兼具隐式激励信号功能——闲置 Agent 会被时间线里的成功案例"带动"']],
    land:'侧边栏 / Agent 卡片的状态点是粗信号，任务详情里的协作时间线是细信号，两层信息密度分开呈现，不混在一起。',
    avoid:[['复杂结构化广播协议','不需要给每条状态更新都编码方向 / 距离 / 质量三个维度，日常状态广播用不到这么复杂的协议']] },
  { scene:'容错与异常处理', where:'全局',
    use:[['协作痕迹机制','反复失败的 Agent / 流程可被临时"隔离降权"，同时保留恢复通道']],
    land:'多次被打回或长期停滞的 Agent，自动降低其在新任务匹配中的权重（临时隔离，不是永久拉黑）；产出质量回升后权重自动恢复。',
    avoid:[['默契规避式处理','异常处理不能靠大家默契避开，必须有显式的隔离和恢复机制留痕，否则问题会被悄悄掩盖而不是真正解决']] },
];
function mechMatrixRowHtml(r, i){
  const useHtml = r.use.map(([m,t])=>`<div class="matrix-line use"><span class="tag">可用 · ${esc(m)}</span>${esc(t)}</div>`).join('');
  const avoidHtml = r.avoid.map(([m,t])=>`<div class="matrix-line avoid"><span class="tag">不用 · ${esc(m)}</span>${esc(t)}</div>`).join('');
  return `<div class="matrix-row">
    <div class="scene"><span class="idx">${String(i+1).padStart(2,'0')}</span><b>${esc(r.scene)}</b><span class="where">${esc(r.where)}</span></div>
    ${useHtml}
    <div class="matrix-land">${ic('chevronRight')}${esc(r.land)}</div>
    ${avoidHtml}
  </div>`;
}

        <div class="provider-models">${p._discovered.map(m=>`<span class="skill-chip">${esc(m.label)}${m.ctx&&m.ctx!=='—'?' · '+m.ctx:''}</span>`).join('')}</div></div>`
    : '';
  return `
    <div class="modal-head"><h3>${p.mode==='create'?'添加模型服务':'编辑模型服务'}</h3><button class="btn-icon" data-close-modal>${ic('close')}</button></div>
    <div class="modal-body">
      <div class="field"><label class="field-label">服务名称</label><input class="input" id="pv-name" value="${esc(p.name)}" placeholder="例如：Anthropic 官方 / 公司网关"></div>
      <div class="field">
        <label class="field-label">服务类型</label>
        <div class="radio-card-group" id="pv-type-group">${typeCards}</div>
      </div>
      <div class="field"><label class="field-label">Base URL</label><input class="input" id="pv-baseurl" value="${esc(p.baseUrl)}" placeholder="https://api.example.com/v1"></div>
      <div class="field"><label class="field-label">API Key</label><input class="input" id="pv-apikey" type="password" value="${esc(p._rawKey||'')}" placeholder="sk-…（仅本地内存态，脱敏保存）"></div>
      <div class="field" style="margin-bottom:0;">
        <button class="btn btn-secondary btn-sm" id="pv-test">${ic('plug')}测试连接并拉取模型</button>
        <span class="pill ${PROVIDER_STATUS_META[p.status].pillClass}" style="margin-left:8px;">${PROVIDER_STATUS_META[p.status].label}</span>
      </div>
      ${discovered}
    </div>
    <div class="modal-foot">
      <button class="btn btn-secondary" data-close-modal>取消</button>

function openProviderModal(providerId){
  const src = providerId ? providerById(providerId) : null;
  draftProvider = src
    ? { ...JSON.parse(JSON.stringify(src)), mode:'edit', _rawKey:'', _discovered:null }
    : { id:'prov-'+Date.now(), mode:'create', name:'', type:'openai', baseUrl:'', apiKeyMasked:'', _rawKey:'', enabled:true, status:'untested', models:[], _discovered:null };
  openModal(providerModalHtml(draftProvider));
  wireProviderModal();
}
function wireProviderModal(){
  const modalRoot = document.getElementById('modal-container');
  function refresh(){ modalRoot.innerHTML = providerModalHtml(draftProvider); makeKeyboardClickable(modalRoot); }
  modalRoot.addEventListener('input', (e)=>{
    if(e.target.id==='pv-name') draftProvider.name = e.target.value;
    else if(e.target.id==='pv-baseurl') draftProvider.baseUrl = e.target.value;
    else if(e.target.id==='pv-apikey') draftProvider._rawKey = e.target.value;
  });
  modalRoot.addEventListener('click', (e)=>{
    if(e.target.closest('[data-close-modal]')){ closeModal(); return; }
    const typeOpt = e.target.closest('[data-provider-type]');
    if(typeOpt){ draftProvider.type = typeOpt.dataset.providerType; modalRoot.querySelectorAll('[data-provider-type]').forEach(o=>o.classList.toggle('selected', o===typeOpt)); return; }
    if(e.target.closest('#pv-test')){
      const btn = e.target.closest('#pv-test'); btn.disabled = true; btn.textContent = '测试中…';
      setTimeout(()=>{
        // 演示态：按类型返回一批示意模型，并把状态置为已连接
        draftProvider._discovered = SAMPLE_DISCOVERY[draftProvider.type].map((m,i)=>({ id:draftProvider.id+'-m'+i, label:m.label, hint:m.hint, ctx:m.ctx }));
        draftProvider.status = 'connected';
        refresh();
        showToast('check', '连接成功，发现 '+draftProvider._discovered.length+' 个模型（演示数据）');
      }, 800);
      return;
    }
    if(e.target.closest('#pv-save')){
      const name = (draftProvider.name||'').trim();
      if(!name){ document.getElementById('pv-name').focus(); showToast('shield','请先填写服务名称'); return; }
      draftProvider.name = name;
      draftProvider.baseUrl = (draftProvider.baseUrl||'').trim() || '（未填写）';
      // 脱敏：只保留前后几位
      const k = (draftProvider._rawKey||'').trim();
      draftProvider.apiKeyMasked = k ? (k.slice(0,6)+'••••••••'+k.slice(-4)) : (draftProvider.apiKeyMasked || '（无需密钥）');
      if(draftProvider._discovered){ draftProvider.models = draftProvider._discovered; }
      const clean = { id:draftProvider.id, name:draftProvider.name, type:draftProvider.type, baseUrl:draftProvider.baseUrl, apiKeyMasked:draftProvider.apiKeyMasked, enabled:draftProvider.enabled!==false, status:draftProvider.status, models:draftProvider.models };
      const idx = PROVIDERS.findIndex(p=>p.id===clean.id);
      if(idx>-1){ PROVIDERS[idx] = clean; showToast('check', clean.name+' 已更新'); }
      else { PROVIDERS.push(clean); showToast('sparkle', clean.name+' 已接入'); }
      closeModal();
      if(State.view==='providers') renderView(); else updateNavCounts();
      return;
    }
  });
}

/* ============================================================
   MODAL / TOAST HELPERS
============================================================ */
function openModal(html, size=''){
  const overlay = document.getElementById('overlay');
  const modal = document.getElementById('modal-container');
  modal.className = 'modal' + (size==='wide' ? ' wide':'');
  modal.innerHTML = html;
  overlay.classList.add('open');
  document.querySelectorAll('[data-close-modal]').forEach(b=>b.addEventListener('click', closeModal));
  makeKeyboardClickable(modal);
}
function closeModal(){ document.getElementById('overlay').classList.remove('open'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

let toastId = 0;
function showToast(icon, text){
  const stack = document.getElementById('toast-stack');
  const id = 'toast-'+(toastId++);
  const el = document.createElement('div');
  el.className = 'toast'; el.id = id;
  el.innerHTML = `<div class="icon-badge">${ic(icon)}</div><div>${esc(text)}</div>`;
  stack.appendChild(el);
  setTimeout(()=>{ el.style.animation = 'toastOut .3s var(--ease) forwards'; setTimeout(()=>el.remove(), 300); }, 3200);
}

/* ============================================================
   EVENT WIRING (per-view + global)
============================================================ */
/* Make non-native clickable elements (div-based cards/chips) keyboard operable:
   focusable via Tab, and activatable via Enter/Space — required for visible-focus to mean anything. */
const KEYBOARD_CLICKABLE_SELECTOR = '[data-open-agent],[data-open-team],[data-open-task],[data-open-doc],[data-claim],[data-agent-filter],[data-collab-pref],[data-priority],[data-assign],[data-view-link],[data-action],[data-emoji],[data-module-toggle-card],[data-model],[data-effort],[data-wizard-jump],[data-provider-type]';
function makeKeyboardClickable(root){
  root.querySelectorAll(KEYBOARD_CLICKABLE_SELECTOR).forEach(el=>{
    if(el.tagName==='BUTTON' || el.tagName==='A' || el.tagName==='INPUT') return;
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
    if(el.dataset.kbBound) return;
    el.dataset.kbBound = '1';
    el.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); el.click(); }
    });
  });
}

function wireViewEvents(){
  document.querySelectorAll('[data-open-agent]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); openAgentDrawer(el.dataset.openAgent); }));
  document.querySelectorAll('[data-open-task]').forEach(el=>el.addEventListener('click', (e)=>{
    if(e.target.closest('[data-claim]') || e.target.closest('[data-pin]')) return;
    const t = taskById(el.dataset.openTask);
    if(t.status==='open') return;
    State.taskDetailId = t.id; switchView('overview');
  }));
  document.querySelectorAll('[data-back-to-board]').forEach(el=>el.addEventListener('click', ()=>{ State.taskDetailId = null; renderView(); }));
  document.querySelectorAll('[data-claim]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); claimTask(el.dataset.claim, el.dataset.claimAgent, el); }));
  document.querySelectorAll('[data-toggle-match]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const panel = document.getElementById('match-detail-'+el.dataset.toggleMatch);
    if(!panel) return;
    panel.hidden = !panel.hidden;
    el.classList.toggle('open', !panel.hidden);
  }));
  document.querySelectorAll('[data-agent-filter]').forEach(el=>el.addEventListener('click', ()=>{ State.agentFilter = el.dataset.agentFilter; renderView(); }));
  document.querySelectorAll('[data-pin]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const t = taskById(el.dataset.pin);
    t.pinned = true;
    showToast('sparkle', '已人工置顶「'+t.title+'」——人工优先级永远盖过算法排序');
    renderView();
  }));
  document.getElementById('create-agent-card')?.addEventListener('click', ()=>openAgentDrawer(null));
  document.getElementById('create-team-card')?.addEventListener('click', ()=>openTeamDrawer(null));
  document.querySelectorAll('[data-open-team]').forEach(el=>el.addEventListener('click', (e)=>{ e.stopPropagation(); openTeamDrawer(el.dataset.openTeam); }));
  document.querySelectorAll('[data-complete-step]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [taskId, idxStr] = el.dataset.completeStep.split('|');
    const t = taskById(taskId); const idx = Number(idxStr);
    const step = t.plan[idx]; if(!step) return;
    step.status = 'done';
    const agent = step.agentId ? agentById(step.agentId) : null;
    const who = agent ? agent.name : '轻量执行单元';
    t.logs.push(agent ? { agentId: agent.id, text:'已完成「'+step.title+'」', time:'刚刚' } : { type:'system', text:'轻量执行单元已完成「'+step.title+'」，随即释放', time:'刚刚' });
    // 步骤是一条共享流水线，不再按"这是不是同一个 Agent 的下一步"筛选——顺序推进到下一步就行，
    // 轻量执行单元没有 agentId 也照样能被激活。
    const next = t.plan[idx+1];
    if(next && next.status==='pending') next.status = 'active';
    const doneCount = t.plan.filter(s=>s.status==='done').length;
    t.progressPct = Math.round(doneCount/t.plan.length*100);
    if(doneCount===t.plan.length){ t.status='review'; showToast('check', who+' 已完成全部步骤，任务转入待评审'); }
    else showToast('check', who+' 已完成「'+step.title+'」');
    renderView();
  }));
  document.querySelectorAll('[data-handoff-step]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const menu = document.getElementById('handoff-menu-'+el.dataset.handoffStep.replace('|','-'));
    if(menu) menu.hidden = !menu.hidden;
  }));
  document.querySelectorAll('[data-handoff-to]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [taskId, idxStr, agentId] = el.dataset.handoffTo.split('|');
    const t = taskById(taskId); const idx = Number(idxStr); const step = t.plan[idx];
    if(!step) return;
    const from = agentById(step.agentId); const to = agentById(agentId);
    step.agentId = agentId;
    if(step.squad) step.squad = [agentId, ...step.squad.filter(id=>id!==from.id)];
    if(!t.assignees.includes(agentId)) t.assignees.push(agentId);
    t.logs.push({ type:'system', text:from.name+' 已把「'+step.title+'」接力交给 '+to.name+'，当前进度保留', time:'刚刚' });
    showToast('users', '「'+step.title+'」已换人接棒给 '+to.name);
    renderView();
  }));
  document.querySelectorAll('[data-mark-bottleneck]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [taskId, idxStr] = el.dataset.markBottleneck.split('|');
    const t = taskById(taskId); const idx = Number(idxStr); const step = t.plan[idx];
    if(!step) return;
    const helper = pickSquadHelper(t, step.agentId);
    step.blocked = true;
    step.squad = [step.agentId, helper.id];
    if(!t.assignees.includes(helper.id)) t.assignees.push(helper.id);
    const downstream = Math.max(1, t.plan.length-idx-1);
    t.logs.push({ type:'system', text:'「'+step.title+'」持续阻塞下游 '+downstream+' 个子任务，已自动拉起临时攻坚小组：'+agentById(step.agentId).name+' + '+helper.name, time:'刚刚' });
    showToast('users', helper.name+' 已临时加入攻坚「'+step.title+'」');
    renderView();
  }));
  document.querySelectorAll('[data-dissolve-squad]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [taskId, idxStr] = el.dataset.dissolveSquad.split('|');
    const t = taskById(taskId); const idx = Number(idxStr); const step = t.plan[idx];
    if(!step) return;
    step.blocked = false;
    step.squad = [step.agentId];
    t.logs.push({ type:'system', text:'「'+step.title+'」卡点已解除，临时攻坚小组自动解散', time:'刚刚' });
    showToast('check', '临时攻坚小组已解散');
    renderView();
  }));
  // 团队模式：负责人给团队成员指派某个步骤
  document.querySelectorAll('[data-team-assign]').forEach(el=>el.addEventListener('change', (e)=>{
    e.stopPropagation();
    const agentId = el.value; if(!agentId) return;
    const [taskId, idxStr] = el.dataset.teamAssign.split('|');
    const t = taskById(taskId); const idx = Number(idxStr); const step = t.plan[idx];
    const agent = agentById(agentId); if(!step || !agent) return;
    step.agentId = agentId;
    if(step.status === 'pending' && !t.plan.some(x => x.status === 'active')) step.status = 'active';
    if(!t.assignees.includes(agentId)) t.assignees.push(agentId);
    if(t.status === 'planning') t.status = 'progress';
    const owner = agentById(t.teamOwnerAgentId || '');
    t.logs.push({ type:'system', text:(owner?owner.name+' ':'')+'（团队负责人）已把「'+step.title+'」指派给 '+agent.name, time:'刚刚' });
    showToast('users', '「'+step.title+'」已指派给 '+agent.name);
    renderView();
  }));
  // 团队模式：全部步骤完成后，负责人"汇总并提交评审"（推入 review）
  document.querySelectorAll('[data-team-summarize]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const t = taskById(el.dataset.teamSummarize); if(!t) return;
    if(!t.plan.every(s => s.status === 'done')){ showToast('shield', '还有未完成的步骤'); return; }
    t.status = 'review';
    const owner = agentById(t.teamOwnerAgentId || '');
    t.logs.push({ type:'system', text:(owner?owner.name+' ':'')+'（团队负责人）已汇总产出并提交评审', time:'刚刚' });
    showToast('check', '任务已汇总提交评审——等待评审人（人工）批准 / 打回');
    renderView();
  }));
  document.querySelectorAll('[data-approve-doc]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [docId, taskId] = el.dataset.approveDoc.split('|');
    const d = docById(docId); const t = taskById(taskId); const author = agentById(d.agentId);
    d.reviewStatus = 'approved';
    t.logs.push({ type:'system', text:'评审人已批准「'+d.title+'」', time:'刚刚' });
    // 批准是唯一改变隔离状态的动作，且永远由人工触发——系统只负责把这个人工判断沉淀成权重变化
    if(author.recentRejects>0){
      author.recentRejects -= 1;
      if(author.recentRejects < REJECT_DOWNWEIGHT_THRESHOLD) t.logs.push({ type:'system', text:author.name+' 产出质量回升，匹配权重正在自动恢复', time:'刚刚' });
    }
    const allApproved = t.docs.every(id=> docById(id).reviewStatus==='approved');
    if(t.status==='review' && allApproved){ t.status='done'; t.progressPct=100; showToast('check', '「'+d.title+'」已批准，全部产出通过，任务标记为已完成'); }
    else showToast('check', '「'+d.title+'」已批准'+(t.status==='review'?'，还有产出待评审':''));
    renderView();
  }));
  document.querySelectorAll('[data-reject-doc]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    const [docId, taskId] = el.dataset.rejectDoc.split('|');
    const d = docById(docId); const t = taskById(taskId); const author = agentById(d.agentId);
    author.recentRejects += 1;
    t.logs.push({ type:'system', text:'评审人已打回「'+d.title+'」，等待负责 Agent 修改', time:'刚刚' });
    if(author.recentRejects===REJECT_DOWNWEIGHT_THRESHOLD) t.logs.push({ type:'system', text:author.name+' 近期多次被打回，匹配权重已临时下调（非永久，产出回升后自动恢复）', time:'刚刚' });
    showToast('trash', '已打回「'+d.title+'」，已通知负责 Agent');
    renderView();
  }));
  document.querySelectorAll('[data-open-doc]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    openModal(docPreviewHtml(docById(el.dataset.openDoc)));
    document.getElementById('btn-export-doc')?.addEventListener('click', ()=>{ showToast('download', '已生成导出任务（原型演示，未产生真实文件）'); });
    document.querySelector('[data-goto-task]')?.addEventListener('click', function(){ State.taskDetailId = this.dataset.gotoTask; closeModal(); switchView('overview'); });
  }));
  document.querySelectorAll('[data-view-link]').forEach(el=>el.addEventListener('click', ()=>{ State.taskDetailId = null; switchView(el.dataset.viewLink); }));
  document.querySelectorAll('[data-docs-view]').forEach(el=>el.addEventListener('click', ()=>{ State.docsView = el.dataset.docsView; renderView(); }));
  document.querySelectorAll('[data-docs-type-filter]').forEach(el=>el.addEventListener('click', ()=>{ State.docsTypeFilter = el.dataset.docsTypeFilter; renderView(); }));
  document.querySelectorAll('[data-open-task-from-docs]').forEach(el=>el.addEventListener('click', ()=>{ State.taskDetailId = el.dataset.openTaskFromDocs; switchView('overview'); }));
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(el.dataset.action==='new-task'){ newTaskSkills = []; switchView('publish-task'); }
  }));
  // 模型接入页
  document.querySelectorAll('[data-provider-add]').forEach(el=>el.addEventListener('click', ()=>openProviderModal(null)));
  document.querySelectorAll('[data-provider-edit]').forEach(el=>el.addEventListener('click', ()=>openProviderModal(el.dataset.providerEdit)));
  document.querySelectorAll('[data-provider-toggle]').forEach(el=>el.addEventListener('change', ()=>{
    const p = providerById(el.dataset.providerToggle); if(!p) return;
    p.enabled = el.checked;
    showToast(p.enabled?'check':'trash', p.name+(p.enabled?' 已启用':' 已停用')+(p.enabled?'':'，其模型不再对 Agent 可选'));
    renderView();
  }));
  document.querySelectorAll('[data-provider-test]').forEach(el=>el.addEventListener('click', ()=>{
    const p = providerById(el.dataset.providerTest); if(!p) return;
    el.disabled = true; el.textContent = '测试中…';
    setTimeout(()=>{ p.status = 'connected'; showToast('check', p.name+' 连接正常，发现 '+p.models.length+' 个模型（演示）'); renderView(); }, 700);
  }));
  document.querySelectorAll('[data-provider-delete]').forEach(el=>el.addEventListener('click', ()=>{
    const p = providerById(el.dataset.providerDelete); if(!p) return;
    const usedBy = AGENTS.filter(a=> p.models.some(m=>m.id===a.model)).map(a=>a.name);
    PROVIDERS = PROVIDERS.filter(x=>x.id!==p.id);
    showToast('trash', p.name+' 已删除'+(usedBy.length? ('，'+usedBy.length+' 个 Agent 的模型需重新选择') : ''));
    renderView();
  }));
  if(State.view==='publish-task') wirePublishTaskEvents();
  makeKeyboardClickable(document.getElementById('view-root'));
}

document.querySelectorAll('.nav-item').forEach(el=>el.addEventListener('click', ()=>{
  State.taskDetailId = null;
  if(el.dataset.view==='publish-task') newTaskSkills = [];
  switchView(el.dataset.view);
  // 窄屏（抽屉模式）导航后顺手收抽屉
  if(matchMedia('(max-width: 880px)').matches) closeSidebar();
}));
document.getElementById('btn-mechanism').addEventListener('click', ()=>openModal(mechanismModalHtml(),'wide'));
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebar-scrim').classList.add('open'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebar-scrim').classList.remove('open'); }
document.getElementById('menu-toggle').addEventListener('click', ()=>{
  document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
});
document.getElementById('sidebar-scrim').addEventListener('click', closeSidebar);

document.getElementById('global-search').addEventListener('keydown', e=>{
  if(e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase(); if(!q) return;
  const hitTask = TASKS.find(t=> t.title.toLowerCase().includes(q));
  const hitAgent = AGENTS.find(a=> a.name.toLowerCase().includes(q) || a.role.toLowerCase().includes(q));
  const hitDoc = DOCS.find(d=> d.title.toLowerCase().includes(q));
  if(hitTask && hitTask.status!=='open'){ State.taskDetailId = hitTask.id; switchView('overview'); }
  else if(hitAgent){ openAgentDrawer(hitAgent.id); }
  else if(hitDoc){ openModal(docPreviewHtml(hitDoc)); }
});

/* ============ Theme ============ */
const systemSchemeQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function updateResolvedLabel(){
  const el = document.getElementById('theme-resolved');
  if(!el) return;
  const isDark = systemSchemeQuery ? systemSchemeQuery.matches : false;
  el.textContent = ' · ' + (isDark ? '深色' : '浅色');
}
function applyTheme(mode){
  const root = document.documentElement;
  if(mode==='system') root.removeAttribute('data-theme');
  else root.setAttribute('data-theme', mode);
  document.querySelectorAll('#theme-toggle button').forEach(b=>b.classList.toggle('active', b.dataset.themeOpt===mode));
  updateResolvedLabel();
  try{ localStorage.setItem('buling-theme', mode); }catch(e){}
}
document.querySelectorAll('#theme-toggle button').forEach(b=>b.addEventListener('click', ()=>applyTheme(b.dataset.themeOpt)));
if(systemSchemeQuery && systemSchemeQuery.addEventListener) systemSchemeQuery.addEventListener('change', updateResolvedLabel);
(function initTheme(){
  let saved = 'system';
  try{ saved = localStorage.getItem('buling-theme') || 'system'; }catch(e){}
  applyTheme(saved);
})();

/* ============ Init ============ */
renderView();
</script>
